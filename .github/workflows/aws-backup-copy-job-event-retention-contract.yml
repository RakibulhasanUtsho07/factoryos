name: AWS Backup Copy Job Event Retention Contract

on:
  pull_request:
    paths:
      - ".github/workflows/aws-backup-copy-job-event-retention-contract.yml"
      - "deploy/aws/aws-backup-copy-job-*.template.json"
      - "docs/aws-backup-copy-job-event-retention.md"
      - "scripts/audit/aws-backup-copy-job-event-retention-contract.test.mjs"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retention-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Validate CloudFormation resource schemas
        run: |
          python -m pip install --disable-pip-version-check cfn-lint
          cfn-lint -t deploy/aws/aws-backup-copy-job-eventbridge-archive.template.json deploy/aws/aws-backup-copy-job-cloudtrail-audit.template.json
      - name: Validate AWS Backup event-retention infrastructure contract
        run: node --test scripts/audit/aws-backup-copy-job-event-retention-contract.test.mjs

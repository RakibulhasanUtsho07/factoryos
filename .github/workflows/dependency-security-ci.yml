name: Production Dependency Security

on:
  pull_request:
    paths:
      - 'docs/merge-commit-release-verification-2026-10-20.md'
      - 'package.json'
      - 'package-lock.json'
      - 'apps/**/package.json'
      - 'services/**/package.json'
      - '.github/workflows/dependency-security-ci.yml'
      - '.github/workflows/api-ci.yml'
      - '.github/workflows/api-postgres-ci.yml'
      - 'scripts/recovery/**'
      - 'scripts/performance/**'
      - 'services/api/test/**'
  push:
    branches: [main, dev, rakibul-hasan]
    paths:
      - 'docs/merge-commit-release-verification-2026-10-20.md'
      - 'package.json'
      - 'package-lock.json'
      - 'apps/**/package.json'
      - 'services/**/package.json'
      - '.github/workflows/dependency-security-ci.yml'
      - '.github/workflows/api-ci.yml'
      - '.github/workflows/api-postgres-ci.yml'
      - 'scripts/recovery/**'
      - 'scripts/performance/**'
      - 'services/api/test/**'

permissions:
  contents: read

concurrency:
  group: dependency-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  production-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install locked workspace dependencies
        run: npm ci

      - name: Validate security-sensitive recovery and load harness syntax
        run: |
          bash -n scripts/recovery/postgres-backup-restore-rehearsal.sh
          node --check scripts/performance/api-load-smoke.mjs
          node --check scripts/performance/api-load-smoke.test.mjs

      - name: Exercise bounded load and backup/restore security controls
        working-directory: services/api
        run: |
          npm run test:load-smoke:contract
          npm run test:recovery:contract

      - name: Audit production dependencies
        run: npm audit --omit=dev

name: Production Dependency Security

on:
  pull_request:
    paths:
      - 'docs/merge-commit-release-verification-2026-10-20.md'
      - 'package.json'
      - 'package-lock.json'
      - 'apps/**/package.json'
      - 'services/**/package.json'
      - '.github/workflows/dependency-security-ci.yml'
      - '.github/workflows/api-ci.yml'
      - '.github/workflows/api-postgres-ci.yml'
      - 'scripts/recovery/**'
      - 'scripts/performance/**'
      - 'scripts/security/**'
      - 'deploy/security/**'
      - 'docs/production-security-configuration-and-independent-review.md'
      - 'docs/backup-copy-evidence-deployment-provisioning.md'
      - 'services/api/test/**'
      - 'services/api/src/auth/**'
  push:
    branches: [main, dev, rakibul-hasan]
    paths:
      - 'docs/merge-commit-release-verification-2026-10-20.md'
      - 'package.json'
      - 'package-lock.json'
      - 'apps/**/package.json'
      - 'services/**/package.json'
      - '.github/workflows/dependency-security-ci.yml'
      - '.github/workflows/api-ci.yml'
      - '.github/workflows/api-postgres-ci.yml'
      - 'scripts/recovery/**'
      - 'scripts/performance/**'
      - 'scripts/security/**'
      - 'deploy/security/**'
      - 'docs/production-security-configuration-and-independent-review.md'
      - 'services/api/test/**'
      - 'services/api/src/auth/**'

permissions:
  contents: read

concurrency:
  group: dependency-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  production-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install locked workspace dependencies
        run: npm ci

      - name: Validate security-sensitive recovery and load harness syntax
        run: |
          bash -n scripts/recovery/postgres-backup-restore-rehearsal.sh
          node --check scripts/performance/api-load-smoke.mjs
          node --check scripts/performance/api-load-smoke.test.mjs
          node --check scripts/security/production-security-config.test.mjs
          node --check scripts/security/validate-production-security-baseline.mjs
          node --check scripts/security/production-security-baseline-validator.test.mjs
          node --check scripts/security/validate-backup-copy-evidence-deployment.mjs
          node --check scripts/security/probe-backup-copy-evidence-runtime.mjs
          node --check scripts/security/backup-copy-evidence-deployment.test.mjs
          bash -n deploy/security/provision-backup-copy-evidence-enforcement.sh
          node scripts/security/validate-production-security-baseline.mjs --check-template

      - name: Exercise bounded load and backup/restore security controls
        working-directory: services/api
        run: |
          npm run test:load-smoke:contract
          npm run test:recovery:contract
          node --test ../../scripts/security/production-security-config.test.mjs ../../scripts/security/production-security-baseline-validator.test.mjs ../../scripts/security/backup-copy-evidence-deployment.test.mjs ../../scripts/security/backup-copy-evidence-readonly-admission.test.mjs

      - name: Audit production dependencies
        run: npm audit --omit=dev

name: Production Dependency Security

on:
  pull_request:
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'apps/**/package.json'
      - 'services/**/package.json'
      - '.github/workflows/dependency-security-ci.yml'
  push:
    branches: [main, dev]
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'apps/**/package.json'
      - 'services/**/package.json'
      - '.github/workflows/dependency-security-ci.yml'

permissions:
  contents: read

concurrency:
  group: dependency-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  production-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install locked workspace dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev

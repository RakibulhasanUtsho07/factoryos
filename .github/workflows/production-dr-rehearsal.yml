name: Production Backup Restore and DR Rehearsal

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact 40-character candidate commit SHA (do not use a moving branch name)
        required: true
        type: string
      source_service:
        description: Preconfigured libpq service name for the approved source snapshot
        required: true
        type: string
      restore_service:
        description: Preconfigured libpq service name for the disposable isolated restore target
        required: true
        type: string
      confirm_empty_restore_target:
        description: Explicitly attest that the selected target is isolated, disposable and empty
        required: true
        type: boolean
        default: false
      backup_output_path:
        description: Absolute path to an existing approved encrypted PostgreSQL .dump.gpg recovery-point artifact in restricted storage
        required: true
        type: string
      approved_backup_manifest_path:
        description: Absolute path to the signed approved-backup manifest JSON in restricted storage
        required: true
        type: string
      approved_backup_signature_path:
        description: Absolute path to the detached OpenPGP signature for the manifest
        required: true
        type: string
      evidence_output_path:
        description: Absolute path in approved protected storage for the machine-readable receipt
        required: true
        type: string
      gpg_recipient:
        description: Approved GPG recipient fingerprint or UID already provisioned on the recovery runner
        required: true
        type: string
      candidate_migration_manifest:
        description: Repository-relative ordered manifest of migrations pending from this source snapshot
        required: true
        type: string
      watermark_sql:
        description: Repository-relative reviewed SQL returning the latest durable recoverable UTC write watermark
        required: true
        type: string
      restore_smoke_sql:
        description: Repository-relative reviewed smoke SQL proving application, tenant isolation and audit continuity
        required: true
        type: string
      simulated_event_time_utc:
        description: Explicit UTC RFC3339 incident/cutoff time used to measure observed RPO
        required: true
        type: string
      approver:
        description: GitHub login of the independent reviewer who approves this Environment deployment
        required: true
        type: string
      targets_approved:
        description: Owner has explicitly approved the supplied RPO/RTO values as applicable targets
        required: true
        type: boolean
        default: false
      rpo_target_seconds:
        description: Owner-approved RPO in seconds (ignored unless targets_approved is true)
        required: false
        type: string
        default: ''
      rto_target_seconds:
        description: Owner-approved RTO in seconds (ignored unless targets_approved is true)
        required: false
        type: string
        default: ''

permissions:
  contents: read
  actions: read

concurrency:
  group: production-dr-rehearsal-${{ inputs.restore_service }}
  cancel-in-progress: false

jobs:
  rehearsal:
    name: Approved encrypted backup and isolated restore
    runs-on: [self-hosted, linux, dr-isolated]
    environment: production-dr-rehearsal
    timeout-minutes: 120
    env:
      CANDIDATE_SHA_INPUT: ${{ inputs.candidate_sha }}
      SOURCE_SERVICE_INPUT: ${{ inputs.source_service }}
      RESTORE_SERVICE_INPUT: ${{ inputs.restore_service }}
      EMPTY_TARGET_CONFIRMED_INPUT: ${{ inputs.confirm_empty_restore_target }}
      BACKUP_OUTPUT_INPUT: ${{ inputs.backup_output_path }}
      APPROVED_BACKUP_MANIFEST_INPUT: ${{ inputs.approved_backup_manifest_path }}
      APPROVED_BACKUP_SIGNATURE_INPUT: ${{ inputs.approved_backup_signature_path }}
      BACKUP_SIGNER_FINGERPRINT: ${{ vars.FACTORYOS_DR_BACKUP_SIGNER_FINGERPRINT }}
      EVIDENCE_OUTPUT_INPUT: ${{ inputs.evidence_output_path }}
      APPROVAL_EVIDENCE_INPUT: ${{ inputs.evidence_output_path }}.approval.json
      GPG_RECIPIENT_INPUT: ${{ inputs.gpg_recipient }}
      CANDIDATE_MANIFEST_INPUT: ${{ inputs.candidate_migration_manifest }}
      WATERMARK_SQL_INPUT: ${{ inputs.watermark_sql }}
      SMOKE_SQL_INPUT: ${{ inputs.restore_smoke_sql }}
      ERASURE_REPLAY_SQL_INPUT: ${{ vars.FACTORYOS_DR_ERASURE_REPLAY_SQL_PATH }}
      ERASURE_VERIFY_SQL_INPUT: ${{ vars.FACTORYOS_DR_ERASURE_VERIFY_SQL_PATH }}
      ERASURE_LEDGER_REFERENCE_INPUT: ${{ vars.FACTORYOS_DR_ERASURE_LEDGER_REFERENCE }}
      ERASURE_LEDGER_SHA256_INPUT: ${{ vars.FACTORYOS_DR_ERASURE_LEDGER_SHA256 }}
      EVENT_TIME_INPUT: ${{ inputs.simulated_event_time_utc }}
      OPERATOR_INPUT: ${{ github.actor }}
      APPROVER_INPUT: ${{ inputs.approver }}
      TARGETS_APPROVED_INPUT: ${{ inputs.targets_approved }}
      RPO_TARGET_INPUT: ${{ inputs.rpo_target_seconds }}
      RTO_TARGET_INPUT: ${{ inputs.rto_target_seconds }}

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.candidate_sha }}
          persist-credentials: false

      - name: Set up Node for evidence receipt
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install and build exact candidate API
        run: |
          npm ci
          npm --workspace services/api run build

      - name: Validate protected runner configuration and candidate
        env:
          PGSERVICEFILE: ${{ vars.FACTORYOS_DR_PGSERVICEFILE_PATH }}
          PGPASSFILE: ${{ vars.FACTORYOS_DR_PGPASSFILE_PATH }}
          GNUPGHOME: ${{ vars.FACTORYOS_DR_GNUPGHOME_PATH }}
          DR_SECURE_TMPDIR: ${{ vars.FACTORYOS_DR_SECURE_TMPDIR }}
          RESTORE_APPLICATION_DATABASE_URL: ${{ secrets.FACTORYOS_DR_APPLICATION_DATABASE_URL }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_SHA_INPUT" =~ ^[a-f0-9]{40}$ ]] || { echo "::error::candidate_sha must be a full 40-character commit SHA"; exit 1; }
          [[ "$(git rev-parse HEAD)" == "$CANDIDATE_SHA_INPUT" ]] || { echo "::error::checkout SHA does not match requested candidate"; exit 1; }
          [[ -n "$PGSERVICEFILE" && -f "$PGSERVICEFILE" && -r "$PGSERVICEFILE" ]] || { echo "::error::PGSERVICEFILE must point to the protected service file provisioned on this runner"; exit 1; }
          [[ -n "$PGPASSFILE" && -f "$PGPASSFILE" && -r "$PGPASSFILE" ]] || { echo "::error::PGPASSFILE must point to the protected credential file provisioned on this runner"; exit 1; }
          [[ "$(stat -c '%a' "$PGSERVICEFILE")" == "600" || "$(stat -c '%a' "$PGSERVICEFILE")" == "400" ]] || { echo "::error::PGSERVICEFILE permissions must be 0600 or 0400"; exit 1; }
          [[ "$(stat -c '%a' "$PGPASSFILE")" == "600" || "$(stat -c '%a' "$PGPASSFILE")" == "400" ]] || { echo "::error::PGPASSFILE permissions must be 0600 or 0400"; exit 1; }
          [[ -n "$GNUPGHOME" && -d "$GNUPGHOME" && -r "$GNUPGHOME" ]] || { echo "::error::GNUPGHOME must point to the approved recovery keyring on this runner"; exit 1; }
          [[ -n "$DR_SECURE_TMPDIR" && -d "$DR_SECURE_TMPDIR" && ! -L "$DR_SECURE_TMPDIR" ]] || { echo "::error::FACTORYOS_DR_SECURE_TMPDIR must be an existing private runner directory"; exit 1; }
          DR_SECURE_TMPDIR="$(readlink -f -- "$DR_SECURE_TMPDIR")"
          [[ "$(findmnt -n -o FSTYPE --target "$DR_SECURE_TMPDIR")" == "tmpfs" ]] || { echo "::error::DR plaintext scratch must be backed by tmpfs"; exit 1; }
          [[ "$(stat -c '%u' -- "$DR_SECURE_TMPDIR")" == "$(id -u)" ]] || { echo "::error::DR tmpfs scratch must be owned by the runner identity"; exit 1; }
          tmp_mode="$(stat -c '%a' -- "$DR_SECURE_TMPDIR")"
          (( (8#$tmp_mode & 0077) == 0 && (8#$tmp_mode & 0300) == 0300 )) || { echo "::error::DR tmpfs scratch must be private to the runner identity"; exit 1; }
          [[ -n "$RESTORE_APPLICATION_DATABASE_URL" ]] || { echo "::error::configure the protected FACTORYOS_DR_APPLICATION_DATABASE_URL environment secret for the restored target application role"; exit 1; }
          [[ "$SOURCE_SERVICE_INPUT" =~ ^[A-Za-z0-9_.-]{1,63}$ && "$RESTORE_SERVICE_INPUT" =~ ^[A-Za-z0-9_.-]{1,63}$ ]] || { echo "::error::service names contain unsupported characters"; exit 1; }
          [[ "$SOURCE_SERVICE_INPUT" != "$RESTORE_SERVICE_INPUT" ]] || { echo "::error::source and restore service names must differ"; exit 1; }
          [[ "$EMPTY_TARGET_CONFIRMED_INPUT" == "true" ]] || { echo "::error::operator must explicitly confirm that restore target is isolated, disposable and empty"; exit 1; }
          grep -Fxq "[$SOURCE_SERVICE_INPUT]" "$PGSERVICEFILE" || { echo "::error::source service is not configured"; exit 1; }
          grep -Fxq "[$RESTORE_SERVICE_INPUT]" "$PGSERVICEFILE" || { echo "::error::restore service is not configured"; exit 1; }
          [[ "$BACKUP_OUTPUT_INPUT" == /* && "$APPROVED_BACKUP_MANIFEST_INPUT" == /* && "$APPROVED_BACKUP_SIGNATURE_INPUT" == /* && "$EVIDENCE_OUTPUT_INPUT" == /* ]] || { echo "::error::approved backup, manifest, signature and evidence paths must be absolute"; exit 1; }
          [[ "$BACKUP_OUTPUT_INPUT" == *.dump.gpg ]] || { echo "::error::approved backup artifact must end in .dump.gpg"; exit 1; }
          for approved_file in "$BACKUP_OUTPUT_INPUT" "$APPROVED_BACKUP_MANIFEST_INPUT" "$APPROVED_BACKUP_SIGNATURE_INPUT"; do
            [[ -f "$approved_file" && ! -L "$approved_file" && -r "$approved_file" && -s "$approved_file" ]] || { echo "::error::approved backup, manifest and signature must be existing readable regular files"; exit 1; }
            file_mode="$(stat -c '%a' -- "$approved_file")"
            (( (8#$file_mode & 0022) == 0 )) || { echo "::error::approved backup, manifest and signature must not be group/world writable"; exit 1; }
          done
          [[ "$BACKUP_SIGNER_FINGERPRINT" =~ ^[A-Fa-f0-9]{40}([A-Fa-f0-9]{24})?$ ]] || { echo "::error::configure the pinned FACTORYOS_DR_BACKUP_SIGNER_FINGERPRINT"; exit 1; }
          [[ -d "$(dirname "$EVIDENCE_OUTPUT_INPUT")" && -w "$(dirname "$EVIDENCE_OUTPUT_INPUT")" ]] || { echo "::error::evidence directory must exist on approved protected storage"; exit 1; }
          [[ ! -e "$EVIDENCE_OUTPUT_INPUT" && ! -L "$EVIDENCE_OUTPUT_INPUT" ]] || { echo "::error::evidence output already exists"; exit 1; }
          [[ ! -e "$APPROVAL_EVIDENCE_INPUT" && ! -L "$APPROVAL_EVIDENCE_INPUT" ]] || { echo "::error::approval evidence output already exists"; exit 1; }
          [[ -f "$CANDIDATE_MANIFEST_INPUT" && -f "$WATERMARK_SQL_INPUT" && -f "$SMOKE_SQL_INPUT" ]] || { echo "::error::candidate manifest, watermark SQL and smoke SQL must exist at the candidate SHA"; exit 1; }
          [[ "$ERASURE_REPLAY_SQL_INPUT" == /* && -f "$ERASURE_REPLAY_SQL_INPUT" && -r "$ERASURE_REPLAY_SQL_INPUT" && ! -L "$ERASURE_REPLAY_SQL_INPUT" ]] || { echo "::error::erasure replay SQL path must be an absolute readable regular file on the protected runner"; exit 1; }
          [[ "$ERASURE_VERIFY_SQL_INPUT" == /* && -f "$ERASURE_VERIFY_SQL_INPUT" && -r "$ERASURE_VERIFY_SQL_INPUT" && ! -L "$ERASURE_VERIFY_SQL_INPUT" ]] || { echo "::error::independent erasure verification SQL path must be an absolute readable regular file on the protected runner"; exit 1; }
          replay_mode="$(stat -c '%a' -- "$ERASURE_REPLAY_SQL_INPUT")"
          verify_mode="$(stat -c '%a' -- "$ERASURE_VERIFY_SQL_INPUT")"
          (( (8#$replay_mode & 0022) == 0 && (8#$verify_mode & 0022) == 0 )) || { echo "::error::erasure replay SQL files must not be group/world writable"; exit 1; }
          [[ "$(readlink -f -- "$ERASURE_REPLAY_SQL_INPUT")" != "$(readlink -f -- "$ERASURE_VERIFY_SQL_INPUT")" ]] || { echo "::error::replay and verification SQL must be separate files"; exit 1; }
          [[ "$ERASURE_LEDGER_REFERENCE_INPUT" =~ ^[A-Za-z0-9][A-Za-z0-9._:-]{2,199}$ ]] || { echo "::error::erasure ledger reference must be an opaque safe identifier"; exit 1; }
          [[ "$ERASURE_LEDGER_SHA256_INPUT" =~ ^[a-f0-9]{64}$ ]] || { echo "::error::erasure ledger SHA-256 must be 64 lowercase hexadecimal characters"; exit 1; }
          [[ "$EVENT_TIME_INPUT" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}([.][0-9]+)?Z$ ]] || { echo "::error::event time must be UTC RFC3339 ending in Z"; exit 1; }
          if [[ "$TARGETS_APPROVED_INPUT" == "true" ]]; then
            [[ "$RPO_TARGET_INPUT" =~ ^[0-9]+$ && "$RTO_TARGET_INPUT" =~ ^[0-9]+$ ]] || { echo "::error::approved RPO/RTO targets must be provided in seconds"; exit 1; }
          fi
          gpg --quiet --list-keys "$GPG_RECIPIENT_INPUT" >/dev/null 2>&1 || { echo "::error::approved GPG recipient key is not present on the recovery runner"; exit 1; }
          gpg --quiet --list-secret-keys "$GPG_RECIPIENT_INPUT" >/dev/null 2>&1 || { echo "::error::approved backup decryption private key is not present on the recovery runner"; exit 1; }
          gpg --quiet --list-keys "$BACKUP_SIGNER_FINGERPRINT" >/dev/null 2>&1 || { echo "::error::pinned backup-controller signing public key is not present on the recovery runner"; exit 1; }
          printf 'candidate_sha=%s\n' "$CANDIDATE_SHA_INPUT"
          printf 'libpq_source_service=CONFIGURED\nlibpq_restore_service=CONFIGURED\nprotected_gpg_recipient=CONFIGURED\n'

      - name: Verify authenticated GitHub Environment reviewer approval
        env:
          GH_TOKEN: ${{ github.token }}
          DR_SECURE_TMPDIR: ${{ vars.FACTORYOS_DR_SECURE_TMPDIR }}
        shell: bash
        run: |
          set -euo pipefail
          approval_history="$(mktemp "$DR_SECURE_TMPDIR/workflow-approvals.XXXXXX")"
          chmod 600 "$approval_history"
          trap 'rm -f -- "$approval_history"' EXIT
          api_base="${GITHUB_API_URL:-https://api.github.com}"
          curl --fail --silent --show-error --retry 2 --retry-all-errors --connect-timeout 10 --max-time 30 \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2026-03-10" \
            "$api_base/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/approvals" \
            --output "$approval_history"
          node scripts/recovery/verify-dr-environment-approval.mjs \
            --approvals-json "$approval_history" \
            --output "$APPROVAL_EVIDENCE_INPUT" \
            --environment production-dr-rehearsal \
            --approver "$APPROVER_INPUT" \
            --operator "$OPERATOR_INPUT" \
            --candidate-sha "$CANDIDATE_SHA_INPUT" \
            --run-id "$GITHUB_RUN_ID" \
            --repository "$GITHUB_REPOSITORY" \
            --targets-approved "$TARGETS_APPROVED_INPUT" \
            --rpo-target-seconds "$RPO_TARGET_INPUT" \
            --rto-target-seconds "$RTO_TARGET_INPUT"

      - name: Execute encrypted backup, restore, migration recovery and verification
        env:
          PGSERVICEFILE: ${{ vars.FACTORYOS_DR_PGSERVICEFILE_PATH }}
          PGPASSFILE: ${{ vars.FACTORYOS_DR_PGPASSFILE_PATH }}
          GNUPGHOME: ${{ vars.FACTORYOS_DR_GNUPGHOME_PATH }}
          FACTORYOS_DR_SECURE_TMPDIR: ${{ vars.FACTORYOS_DR_SECURE_TMPDIR }}
          FACTORYOS_DR_ENVIRONMENT: production-dr-rehearsal
          RESTORE_APPLICATION_DATABASE_URL: ${{ secrets.FACTORYOS_DR_APPLICATION_DATABASE_URL }}
        shell: bash
        run: |
          set -euo pipefail
          target_approval=NO
          if [[ "$TARGETS_APPROVED_INPUT" == "true" ]]; then target_approval=YES; fi
          PGSERVICEFILE="$PGSERVICEFILE" \
          PGPASSFILE="$PGPASSFILE" \
          GNUPGHOME="$GNUPGHOME" \
          FACTORYOS_DR_MODE=RELEASE_GATE \
          FACTORYOS_BACKUP_SOURCE_MODE=APPROVED_ARTIFACT \
          FACTORYOS_APPROVED_BACKUP_MANIFEST="$APPROVED_BACKUP_MANIFEST_INPUT" \
          FACTORYOS_APPROVED_BACKUP_SIGNATURE="$APPROVED_BACKUP_SIGNATURE_INPUT" \
          FACTORYOS_APPROVED_BACKUP_SIGNER_FINGERPRINT="$BACKUP_SIGNER_FINGERPRINT" \
          FACTORYOS_BACKUP_PGSERVICE="$SOURCE_SERVICE_INPUT" \
          FACTORYOS_RESTORE_PGSERVICE="$RESTORE_SERVICE_INPUT" \
          FACTORYOS_BACKUP_OUTPUT="$BACKUP_OUTPUT_INPUT" \
          FACTORYOS_BACKUP_GPG_RECIPIENT="$GPG_RECIPIENT_INPUT" \
          FACTORYOS_RESTORE_SMOKE_SQL="$SMOKE_SQL_INPUT" \
          FACTORYOS_RESTORE_CONFIRM_EMPTY_DATABASE=I_HAVE_VERIFIED_EMPTY \
          FACTORYOS_RECOVERY_EVIDENCE_JSON="$EVIDENCE_OUTPUT_INPUT" \
          FACTORYOS_CANDIDATE_MIGRATION_MANIFEST="$CANDIDATE_MANIFEST_INPUT" \
          FACTORYOS_RECOVERY_WATERMARK_SQL="$WATERMARK_SQL_INPUT" \
          FACTORYOS_RECOVERY_EVENT_TIME_UTC="$EVENT_TIME_INPUT" \
          FACTORYOS_RECOVERY_OPERATOR="$OPERATOR_INPUT" \
          FACTORYOS_RECOVERY_APPROVER="$APPROVER_INPUT" \
          FACTORYOS_DR_APPLICATION_DATABASE_URL="$RESTORE_APPLICATION_DATABASE_URL" \
          FACTORYOS_DR_TARGETS_APPROVED="$target_approval" \
          FACTORYOS_RECOVERY_RPO_TARGET_SECONDS="$RPO_TARGET_INPUT" \
          FACTORYOS_RECOVERY_RTO_TARGET_SECONDS="$RTO_TARGET_INPUT" \
          FACTORYOS_CANDIDATE_SHA="$CANDIDATE_SHA_INPUT" \
          FACTORYOS_RESTORE_ERASURE_REPLAY_SQL="$ERASURE_REPLAY_SQL_INPUT" \
          FACTORYOS_RESTORE_ERASURE_VERIFY_SQL="$ERASURE_VERIFY_SQL_INPUT" \
          FACTORYOS_RESTORE_ERASURE_LEDGER_REFERENCE="$ERASURE_LEDGER_REFERENCE_INPUT" \
          FACTORYOS_RESTORE_ERASURE_LEDGER_SHA256="$ERASURE_LEDGER_SHA256_INPUT" \
          bash scripts/recovery/postgres-backup-restore-rehearsal.sh

      - name: Print receipt location and checksum without exposing database contents
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f "$EVIDENCE_OUTPUT_INPUT" ]]; then
            sha256sum "$EVIDENCE_OUTPUT_INPUT"
            [[ ! -f "$APPROVAL_EVIDENCE_INPUT" ]] || sha256sum "$APPROVAL_EVIDENCE_INPUT"
            echo "Rehearsal and authenticated approval evidence were written to protected storage."
          else
            echo "::warning::No complete evidence receipt was written; inspect the failing step and preserve the encrypted backup."
          fi

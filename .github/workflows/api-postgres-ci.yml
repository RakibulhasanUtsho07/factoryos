name: API PostgreSQL CI

on:
  pull_request:
    paths:
      - 'services/api/**'
      - 'migrations/**'
      - 'scripts/seed-dev-iam.sql'
      - '.github/workflows/api-postgres-ci.yml'
      - 'package.json'
      - 'package-lock.json'
  push:
    branches: [main, dev]
    paths:
      - 'services/api/**'
      - 'migrations/**'
      - 'scripts/seed-dev-iam.sql'
      - '.github/workflows/api-postgres-ci.yml'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read

concurrency:
  group: api-postgres-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-postgres-only
          POSTGRES_DB: factoryos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d factoryos_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://factoryos_app:ci-app-only@127.0.0.1:5432/factoryos_test
      TEST_ADMIN_DATABASE_URL: postgresql://postgres:ci-postgres-only@127.0.0.1:5432/factoryos_test
      B19_TEST_ADMIN_DATABASE_URL: postgresql://postgres:ci-postgres-only@127.0.0.1:5432/factoryos_b19_restore_test_ci
      JWT_SECRET: ci-only-not-a-production-secret
      NODE_ENV: test
      PORT: 3001
      AUTH_MODE: dev
      DEV_AUTH_ENABLED: 'false'
      DEV_AUTH_SECRET: ci-only-dev-secret
      OUTBOX_DISPATCHER_ENABLED: 'false'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Initialize isolated PostgreSQL test database
        shell: bash
        run: |
          set -euo pipefail
          export PGPASSWORD=ci-postgres-only
          for migration in migrations/*.sql; do
            echo "Applying $migration"
            psql "postgresql://postgres@127.0.0.1:5432/factoryos_test" \
              -v ON_ERROR_STOP=1 -f "$migration"
          done

          psql "postgresql://postgres@127.0.0.1:5432/factoryos_test" \
            -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'factoryos_app') THEN
              CREATE ROLE factoryos_app LOGIN PASSWORD 'ci-app-only' NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOBYPASSRLS;
            ELSE
              ALTER ROLE factoryos_app LOGIN PASSWORD 'ci-app-only' NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOBYPASSRLS;
            END IF;
          END;
          $$;
          GRANT CONNECT ON DATABASE factoryos_test TO factoryos_app;
          GRANT USAGE ON SCHEMA public TO factoryos_app;
          GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO factoryos_app;
          GRANT USAGE, SELECT, UPDATE ON ALL SEQUENCES IN SCHEMA public TO factoryos_app;
          ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO factoryos_app;
          ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT USAGE, SELECT, UPDATE ON SEQUENCES TO factoryos_app;
          SQL

          psql "postgresql://postgres@127.0.0.1:5432/factoryos_test" \
            -v ON_ERROR_STOP=1 -f scripts/seed-dev-iam.sql
          psql "postgresql://postgres@127.0.0.1:5432/factoryos_test" \
            -v ON_ERROR_STOP=1 -f services/api/test/ci-postgres-seed.sql

          # B19 tests require a dedicated, idle template DB with migration 028.
          # It is created only inside this ephemeral CI PostgreSQL service.
          psql "postgresql://postgres@127.0.0.1:5432/postgres" \
            -v ON_ERROR_STOP=1 -c \
            'CREATE DATABASE factoryos_b19_restore_test_ci TEMPLATE factoryos_test'

          psql "postgresql://postgres@127.0.0.1:5432/factoryos_b19_restore_test_ci" \
            -v ON_ERROR_STOP=1 -c \
            "SELECT version FROM schema_migrations WHERE version = '028_ai_execution_claim_reconciliation'"

      - name: Lint API
        working-directory: services/api
        run: npm run lint

      - name: Build API
        working-directory: services/api
        run: npm run build

      - name: Run all API unit and PostgreSQL integration tests
        working-directory: services/api
        run: node --experimental-vm-modules ../../node_modules/jest/bin/jest.js --config ./jest.config.cjs --runInBand

name: API PostgreSQL CI

on:
  pull_request:
    paths:
      - 'docs/merge-commit-release-verification-2026-10-20.md'
      - 'services/api/**'
      - 'scripts/performance/**'
      - 'scripts/security/**'
      - 'deploy/security/**'
      - 'deploy/event-bus/**'
      - 'scripts/event-bus/**'
      - 'docs/production-security-configuration-and-independent-review.md'
      - 'deploy/observability/**'
      - 'docs/central-observability-slo-capacity.md'
      - 'scripts/recovery/**'
      - 'scripts/audit/**'
      - 'migrations/**'
      - 'scripts/seed-dev-iam.sql'
      - 'scripts/seed-dev-factory-manager.sql'
      - '.github/workflows/api-postgres-ci.yml'
      - '.github/workflows/api-ci.yml'
      - 'package.json'
      - 'package-lock.json'
  push:
    branches: [main, dev, rakibul-hasan]
    paths:
      - 'docs/merge-commit-release-verification-2026-10-20.md'
      - 'services/api/**'
      - 'scripts/performance/**'
      - 'scripts/security/**'
      - 'deploy/security/**'
      - 'docs/production-security-configuration-and-independent-review.md'
      - 'deploy/observability/**'
      - 'docs/central-observability-slo-capacity.md'
      - 'scripts/recovery/**'
      - 'scripts/audit/**'
      - 'migrations/**'
      - 'scripts/seed-dev-iam.sql'
      - 'scripts/seed-dev-factory-manager.sql'
      - '.github/workflows/api-postgres-ci.yml'
      - '.github/workflows/api-ci.yml'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read

concurrency:
  group: api-postgres-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-postgres-only
          POSTGRES_DB: factoryos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d factoryos_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://factoryos_app:ci-app-only@127.0.0.1:5432/factoryos_test
      TEST_APP_DATABASE_URL: postgresql://factoryos_app:ci-app-only@127.0.0.1:5432/factoryos_test
      TEST_ADMIN_DATABASE_URL: postgresql://factoryos:ci-admin-only@127.0.0.1:5432/factoryos_test
      B19_TEST_ADMIN_DATABASE_URL: postgresql://postgres:ci-postgres-only@127.0.0.1:5432/factoryos_b19_restore_test_ci
      SAAS_TRANSFER_TARGET_DATABASE_URL: postgresql://factoryos:ci-admin-only@127.0.0.1:5432/factoryos_transfer_target_test_ci
      JWT_SECRET: ci-only-not-a-production-secret
      NODE_ENV: test
      PORT: 3001
      AUTH_MODE: dev
      DEV_AUTH_ENABLED: 'false'
      DEV_AUTH_SECRET: ci-only-dev-secret
      OUTBOX_DISPATCHER_ENABLED: 'false'

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build candidate API for restored-database smoke test
        run: npm --workspace services/api run build

      - name: Initialize isolated PostgreSQL test database
        shell: bash
        run: |
          set -euo pipefail
          export PGPASSWORD=ci-postgres-only

          # These numbered files are not a simple lexical sequence:
          # 003_outbox_event_envelope alters outbox_events created by 004_orders_outbox.
          # Validate the canonical ordered migration list, its inventory, and its SHA-256 before applying DDL.
          node scripts/audit/verify-migration-manifest.mjs
          mapfile -t migrations < <(grep -Ev '^[[:space:]]*(#|$)' scripts/audit/migration-manifest.txt)

          for migration in "${migrations[@]}"; do
            echo "Applying $migration"
            psql "postgresql://postgres@127.0.0.1:5432/factoryos_test" \
              -v ON_ERROR_STOP=1 -f "$migration"
          done

          echo "Reapplying forecast evaluation migration to verify idempotent policy and trigger installation"
          psql "postgresql://postgres@127.0.0.1:5432/factoryos_test" \
            -v ON_ERROR_STOP=1 -f migrations/151_growth_forecast_evaluation_calibration.sql

          echo "Reapplying agent retry migration to verify idempotent trigger and constraint installation"
          psql "postgresql://postgres@127.0.0.1:5432/factoryos_test" \
            -v ON_ERROR_STOP=1 -f migrations/152_ai_agent_retry_backoff.sql

          echo "Reapplying SaaS monetary precision migration to verify idempotent type/constraint installation"
          psql "postgresql://postgres@127.0.0.1:5432/factoryos_test" \
            -v ON_ERROR_STOP=1 -f migrations/153_saas_money_aggregation_precision.sql

          echo "Reapplying SaaS entitlement enforcement migration to verify idempotent policy/trigger installation"
          psql "postgresql://postgres@127.0.0.1:5432/factoryos_test" \
            -v ON_ERROR_STOP=1 -f migrations/154_saas_entitlement_enforcement_modes.sql

          echo "Reapplying SaaS retention/erasure execution migration to verify lifecycle and receipt idempotency"
          psql "postgresql://postgres@127.0.0.1:5432/factoryos_test" \
            -v ON_ERROR_STOP=1 -f migrations/155_saas_retention_execution_and_erasure_receipts.sql

          echo "Reapplying tenant privacy inventory migration to verify RLS policy idempotency"
          psql "postgresql://postgres@127.0.0.1:5432/factoryos_test" \
            -v ON_ERROR_STOP=1 -f migrations/156_tenant_privacy_inventory_and_rls_guardrails.sql

          echo "Reapplying tenant ownership review migration to verify FK-derived policy idempotency"
          psql "postgresql://postgres@127.0.0.1:5432/factoryos_test" \
            -v ON_ERROR_STOP=1 -f migrations/159_tenant_relation_ownership_reviews.sql

          echo "Reapplying OPC UA gateway migration to verify permission and audit contract idempotency"
          psql "postgresql://postgres@127.0.0.1:5432/factoryos_test" \
            -v ON_ERROR_STOP=1 -f migrations/157_ot_opcua_read_gateway.sql

          echo "Reapplying MQTT/Modbus gateway migration to verify permission and audit contract idempotency"
          psql "postgresql://postgres@127.0.0.1:5432/factoryos_test" \
            -v ON_ERROR_STOP=1 -f migrations/158_ot_mqtt_modbus_gateway.sql

          echo "Reapplying external erasure propagation migration to verify lifecycle, receipt and finance policy idempotency"
          psql "postgresql://postgres@127.0.0.1:5432/factoryos_test" \
            -v ON_ERROR_STOP=1 -f migrations/160_saas_external_erasure_propagation_and_finance_retention.sql

          echo "Reapplying bin cycle-count migration to verify snapshot/approval schema idempotency"
          psql "postgresql://postgres@127.0.0.1:5432/factoryos_test" \
            -v ON_ERROR_STOP=1 -f migrations/159_inventory_location_cycle_count_workflow.sql

          echo "Rechecking all tenant ownership classifications after the newest governance relations were created"
          psql "postgresql://postgres@127.0.0.1:5432/factoryos_test" \
            -v ON_ERROR_STOP=1 -f migrations/159_tenant_relation_ownership_reviews.sql

          echo "Reapplying WMS FEFO/lot allocation migration to verify allocation and partial-issue DDL idempotency"
          psql "postgresql://postgres@127.0.0.1:5432/factoryos_test" \
            -v ON_ERROR_STOP=1 -f migrations/160_wms_fefo_lot_serial_partial_issue.sql

          psql "postgresql://postgres@127.0.0.1:5432/factoryos_test" \
            -v ON_ERROR_STOP=1 -f services/api/test/inventory-bin-reservations.sql

          psql "postgresql://postgres@127.0.0.1:5432/factoryos_test" \
            -v ON_ERROR_STOP=1 -f services/api/test/inventory-wms-allocation.sql

          psql "postgresql://postgres@127.0.0.1:5432/factoryos_test" \
            -v ON_ERROR_STOP=1 -f services/api/test/inventory-replenishment.sql

          psql "postgresql://postgres@127.0.0.1:5432/factoryos_test" \
            -v ON_ERROR_STOP=1 -f services/api/test/purchase-order-lifecycle.sql

          psql "postgresql://postgres@127.0.0.1:5432/factoryos_test" \
            -v ON_ERROR_STOP=1 -f services/api/test/goods-receipt.sql

          psql "postgresql://postgres@127.0.0.1:5432/factoryos_test" \
            -v ON_ERROR_STOP=1 -f services/api/test/traceability.sql
          psql "postgresql://postgres@127.0.0.1:5432/factoryos_test" \
            -v ON_ERROR_STOP=1 -f services/api/test/quality-management-contract.sql

          echo "Checking AQL sampling, fabric roll scoring, supplier quality and Pareto acceptance"
          psql "postgresql://postgres@127.0.0.1:5432/factoryos_test" \
            -v ON_ERROR_STOP=1 -f services/api/test/quality-advanced-acceptance.sql

          echo "Running AQL, fabric roll scoring, quarantine and approved disposition data-path acceptance"
          psql "postgresql://postgres@127.0.0.1:5432/factoryos_test" \
            -v ON_ERROR_STOP=1 -f services/api/test/quality-advanced-data-path.sql

          echo "Running populated AQL, fabric roll scoring, hold and authorized-release acceptance fixture"
          psql "postgresql://postgres@127.0.0.1:5432/factoryos_test" \
            -v ON_ERROR_STOP=1 -f services/api/test/quality-advanced-workflow.sql

          echo "Running tracked rework input, verified recovered receipt and inventory conservation acceptance"
          psql "postgresql://postgres@127.0.0.1:5432/factoryos_test" \
            -v ON_ERROR_STOP=1 -f services/api/test/quality-rework-inventory.sql


          psql "postgresql://postgres@127.0.0.1:5432/factoryos_test" \
            -v ON_ERROR_STOP=1 -f services/api/test/uom-conversion.sql

          psql "postgresql://postgres@127.0.0.1:5432/factoryos_test" \
            -v ON_ERROR_STOP=1 -f services/api/test/product-bom-routing-contract.sql

          echo "Checking PLM/ECO effective-dated revisions and immutable production snapshots"
          psql "postgresql://postgres@127.0.0.1:5432/factoryos_test" \
            -v ON_ERROR_STOP=1 -f services/api/test/product-change-order-contract.sql

          echo "Reapplying PLM/ECO migration to verify lifecycle guard idempotency"
          psql "postgresql://postgres@127.0.0.1:5432/factoryos_test" \
            -v ON_ERROR_STOP=1 -f migrations/162_plm_eco_effective_dated_revision_integration.sql

          echo "Reapplying finite-capacity planning migration to verify idempotency"
          psql "postgresql://postgres@127.0.0.1:5432/factoryos_test" \
            -v ON_ERROR_STOP=1 -f migrations/163_mrp_finite_capacity_planning.sql

          echo "Reapplying advanced quality migration to verify idempotent profiles, evidence and tenant policies"
          psql "postgresql://postgres@127.0.0.1:5432/factoryos_test" \
            -v ON_ERROR_STOP=1 -f migrations/164_quality_advanced_sampling_supplier_pareto.sql

          echo "Reapplying quality disposition inventory balance guard to verify idempotency"
          psql "postgresql://postgres@127.0.0.1:5432/factoryos_test" \
            -v ON_ERROR_STOP=1 -f migrations/165_quality_disposition_inventory_balance_guard.sql

          echo "Reapplying rework inventory ledger migration to verify idempotency"
          psql "postgresql://postgres@127.0.0.1:5432/factoryos_test" \
            -v ON_ERROR_STOP=1 -f migrations/166_quality_rework_inventory_ledger.sql

          echo "Reapplying sampling binding state guard migration to verify safe schema replay"
          psql "postgresql://postgres@127.0.0.1:5432/factoryos_test" \
            -v ON_ERROR_STOP=1 -f migrations/167_quality_sampling_binding_state_guard.sql

          echo "Reapplying energy/EHS lifecycle closure migration to verify policy, RLS and trigger idempotency"
          psql "postgresql://postgres@127.0.0.1:5432/factoryos_test" \
            -v ON_ERROR_STOP=1 -f migrations/168_energy_utility_ehs_lifecycle_closure.sql

          echo "Reapplying Kafka event-bus DLQ migration to verify broker redrive policy and trigger idempotency"
          psql "postgresql://postgres@127.0.0.1:5432/factoryos_test" \
            -v ON_ERROR_STOP=1 -f migrations/169_kafka_event_bus_transport.sql

          # The target importer is tested against a distinct database with the same reviewed schema.
          psql "postgresql://postgres@127.0.0.1:5432/postgres" -v ON_ERROR_STOP=1 -c \
            'CREATE DATABASE factoryos_transfer_target_test_ci'
          for migration in "${migrations[@]}"; do
            echo "Applying target $migration"
            psql "postgresql://postgres@127.0.0.1:5432/factoryos_transfer_target_test_ci" \
              -v ON_ERROR_STOP=1 -f "$migration"
          done

          psql "postgresql://postgres@127.0.0.1:5432/factoryos_test" \
            -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE factoryos LOGIN PASSWORD 'ci-admin-only' SUPERUSER CREATEDB CREATEROLE;
          CREATE ROLE factoryos_app LOGIN PASSWORD 'ci-app-only' NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOBYPASSRLS;
          GRANT CONNECT ON DATABASE factoryos_test TO factoryos_app;
          GRANT USAGE ON SCHEMA public TO factoryos_app;
          GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO factoryos_app;
          GRANT USAGE, SELECT, UPDATE ON ALL SEQUENCES IN SCHEMA public TO factoryos_app;
           GRANT EXECUTE ON FUNCTION public.factoryos_resolve_integration_webhook(uuid) TO factoryos_app;
          ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO factoryos_app;
          ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT USAGE, SELECT, UPDATE ON SEQUENCES TO factoryos_app;
          SQL

          psql "postgresql://postgres@127.0.0.1:5432/factoryos_test" \
            -v ON_ERROR_STOP=1 -f scripts/seed-dev-iam.sql
          psql "postgresql://postgres@127.0.0.1:5432/factoryos_test" \
            -v ON_ERROR_STOP=1 -f services/api/test/ci-postgres-seed.sql
          psql "postgresql://postgres@127.0.0.1:5432/factoryos_test" \
            -v ON_ERROR_STOP=1 -f scripts/seed-dev-factory-manager.sql

          psql "postgresql://postgres@127.0.0.1:5432/factoryos_test" \
            -v ON_ERROR_STOP=1 -f scripts/seed-dev-quality-manager.sql
          # OT protocol permission assertions run after development role/permission seeding.
          psql "postgresql://postgres@127.0.0.1:5432/factoryos_test" \
            -v ON_ERROR_STOP=1 -f services/api/test/ot-opcua-read-contract.sql
          psql "postgresql://postgres@127.0.0.1:5432/factoryos_test" \
            -v ON_ERROR_STOP=1 -f services/api/test/ot-mqtt-modbus-contract.sql
          psql "postgresql://postgres@127.0.0.1:5432/factoryos_test" -v ON_ERROR_STOP=1 -f services/api/test/maintenance-management-contract.sql
          psql "postgresql://postgres@127.0.0.1:5432/factoryos_test" -v ON_ERROR_STOP=1 -f services/api/test/maintenance-lifecycle.sql
          psql "postgresql://postgres@127.0.0.1:5432/factoryos_test" -v ON_ERROR_STOP=1 -f services/api/test/workforce-management-contract.sql
          psql "postgresql://postgres@127.0.0.1:5432/factoryos_test" -v ON_ERROR_STOP=1 -f services/api/test/workforce-lifecycle.sql
          psql "postgresql://postgres@127.0.0.1:5432/factoryos_test" -v ON_ERROR_STOP=1 -f services/api/test/utility-management-contract.sql
          psql "postgresql://postgres@127.0.0.1:5432/factoryos_test" -v ON_ERROR_STOP=1 -f services/api/test/utility-lifecycle.sql
          psql "postgresql://postgres@127.0.0.1:5432/factoryos_test" -v ON_ERROR_STOP=1 -f services/api/test/ehs-management-contract.sql
          psql "postgresql://postgres@127.0.0.1:5432/factoryos_test" -v ON_ERROR_STOP=1 -f services/api/test/ehs-lifecycle.sql
          echo "Verifying normalized vendor events, threshold alerts, drill close-out, SDS and contractor induction lifecycle"
          psql "postgresql://postgres@127.0.0.1:5432/factoryos_test" -v ON_ERROR_STOP=1 -f services/api/test/energy-ehs-closure.sql
          psql "postgresql://postgres@127.0.0.1:5432/factoryos_test" -v ON_ERROR_STOP=1 -f services/api/test/commercial-quotation.sql
          psql "postgresql://postgres@127.0.0.1:5432/factoryos_test" -v ON_ERROR_STOP=1 -f services/api/test/should-cost.sql
          psql "postgresql://postgres@127.0.0.1:5432/factoryos_test" -v ON_ERROR_STOP=1 -f services/api/test/finance-integration.sql
           psql "postgresql://postgres@127.0.0.1:5432/factoryos_test" -v ON_ERROR_STOP=1 -f services/api/test/outbox-dlq-replay-idempotency.sql
          psql "postgresql://postgres@127.0.0.1:5432/factoryos_test" -v ON_ERROR_STOP=1 -f services/api/test/outbox-bus-dlq-contract.sql
           psql "postgresql://postgres@127.0.0.1:5432/factoryos_test" -v ON_ERROR_STOP=1 -f services/api/test/integration-webhook.sql
           psql "postgresql://postgres@127.0.0.1:5432/factoryos_test" -v ON_ERROR_STOP=1 -f services/api/test/integration-reconciliation.sql
           psql "postgresql://postgres@127.0.0.1:5432/factoryos_test" -v ON_ERROR_STOP=1 -f services/api/test/cbb-evidence-provenance.sql
           psql "postgresql://postgres@127.0.0.1:5432/factoryos_test" -v ON_ERROR_STOP=1 -f services/api/test/cbb-governance.sql
           psql "postgresql://postgres@127.0.0.1:5432/factoryos_test" -v ON_ERROR_STOP=1 -f services/api/test/research-ingestion-provenance.sql
           psql "postgresql://postgres@127.0.0.1:5432/factoryos_test" -v ON_ERROR_STOP=1 -f services/api/test/research-release-lifecycle.sql
          psql "postgresql://postgres@127.0.0.1:5432/factoryos_test" -v ON_ERROR_STOP=1 -f services/api/test/growth-opportunity-governance.sql
          psql "postgresql://postgres@127.0.0.1:5432/factoryos_test" -v ON_ERROR_STOP=1 -f services/api/test/growth-scenario-sets.sql
           psql "postgresql://postgres@127.0.0.1:5432/factoryos_test" -v ON_ERROR_STOP=1 -f services/api/test/growth-experiment-outcomes.sql
           psql "postgresql://postgres@127.0.0.1:5432/factoryos_test" -v ON_ERROR_STOP=1 -f services/api/test/growth-forecast-evaluations.sql
           psql "postgresql://postgres@127.0.0.1:5432/factoryos_test" -v ON_ERROR_STOP=1 -f services/api/test/ai-agent-retry-scheduling.sql
           psql "postgresql://postgres@127.0.0.1:5432/factoryos_test" -v ON_ERROR_STOP=1 -f services/api/test/saas-money-precision.sql
           psql "postgresql://postgres@127.0.0.1:5432/factoryos_test" -v ON_ERROR_STOP=1 -f services/api/test/saas-entitlement-enforcement.sql
           psql "postgresql://postgres@127.0.0.1:5432/factoryos_test" -v ON_ERROR_STOP=1 -f services/api/test/ai-decision-envelope-lifecycle.sql
          psql "postgresql://postgres@127.0.0.1:5432/factoryos_test" -v ON_ERROR_STOP=1 -f services/api/test/ot-device-contract.sql
          psql "postgresql://postgres@127.0.0.1:5432/factoryos_test" -v ON_ERROR_STOP=1 -f services/api/test/saas-data-retention-contract.sql
          psql "postgresql://postgres@127.0.0.1:5432/factoryos_test" -v ON_ERROR_STOP=1 -f services/api/test/saas-tenant-propagation-contract.sql
           psql "postgresql://postgres@127.0.0.1:5432/factoryos_test" -v ON_ERROR_STOP=1 -f services/api/test/saas-tenant-isolation-matrix.sql
           psql "postgresql://postgres@127.0.0.1:5432/factoryos_test" -v ON_ERROR_STOP=1 -f services/api/test/tenant-data-governance-inventory.sql
           psql "postgresql://postgres@127.0.0.1:5432/factoryos_test" -v ON_ERROR_STOP=1 -f services/api/test/tenant-ownership-review.sql

          # Deterministic two-tenant rows verify that data and audit history survive encrypted restore.
          psql "postgresql://postgres@127.0.0.1:5432/factoryos_test" -v ON_ERROR_STOP=1 <<'SQL'
          BEGIN;
          INSERT INTO tenants (id,slug,name,status,timezone,default_locale) VALUES
            ('e7110000-0000-4000-8000-000000000001','dr-rehearsal-a-ci','DR rehearsal tenant A','ACTIVE','Asia/Dhaka','en-BD'),
            ('e7110000-0000-4000-8000-000000000002','dr-rehearsal-b-ci','DR rehearsal tenant B','ACTIVE','Asia/Dhaka','en-BD')
          ON CONFLICT (id) DO UPDATE SET slug=EXCLUDED.slug,name=EXCLUDED.name,status='ACTIVE';
          INSERT INTO users (id,external_subject,email,display_name,status) VALUES
            ('e7120000-0000-4000-8000-000000000001','dr-rehearsal-a-ci','dr-rehearsal-a@factoryos.test','DR rehearsal A','ACTIVE'),
            ('e7120000-0000-4000-8000-000000000002','dr-rehearsal-b-ci','dr-rehearsal-b@factoryos.test','DR rehearsal B','ACTIVE')
          ON CONFLICT (id) DO UPDATE SET display_name=EXCLUDED.display_name,status='ACTIVE';
          INSERT INTO factories (id,tenant_id,code,name,status,timezone) VALUES
            ('e7130000-0000-4000-8000-000000000001','e7110000-0000-4000-8000-000000000001','DR-RESTORE-A','DR restore fixture A','ACTIVE','Asia/Dhaka'),
            ('e7130000-0000-4000-8000-000000000002','e7110000-0000-4000-8000-000000000002','DR-RESTORE-B','DR restore fixture B','ACTIVE','Asia/Dhaka')
          ON CONFLICT (id) DO UPDATE SET name=EXCLUDED.name,status='ACTIVE';
          INSERT INTO audit_events (id,tenant_id,actor_user_id,event_type,action,resource_type,resource_id,data_class,payload,created_at) VALUES
            ('e7140000-0000-4000-8000-000000000001','e7110000-0000-4000-8000-000000000001','e7120000-0000-4000-8000-000000000001','RECOVERY_REHEARSAL','RESTORE_CONTINUITY','TENANT','e7110000-0000-4000-8000-000000000001','INTERNAL','{"fixture":"backup-restore-audit-continuity","tenant":"A"}'::jsonb,clock_timestamp()),
            ('e7140000-0000-4000-8000-000000000002','e7110000-0000-4000-8000-000000000002','e7120000-0000-4000-8000-000000000002','RECOVERY_REHEARSAL','RESTORE_CONTINUITY','TENANT','e7110000-0000-4000-8000-000000000002','INTERNAL','{"fixture":"backup-restore-audit-continuity","tenant":"B"}'::jsonb,clock_timestamp())
          ON CONFLICT (id) DO UPDATE SET payload=EXCLUDED.payload,created_at=EXCLUDED.created_at;
          COMMIT;
          SQL

          # This end-to-end check uses only an ephemeral CI database and a one-run GPG key.
          # The encrypted dump and private key remain on the runner and are never uploaded.
          recovery_home="$(mktemp -d)"
          recovery_backup_dir="$RUNNER_TEMP/dr-backups"
          recovery_evidence_dir="$RUNNER_TEMP/dr-evidence"
          mkdir -m 700 -p "$recovery_backup_dir" "$recovery_evidence_dir"
          chmod 700 "$recovery_home"
          export GNUPGHOME="$recovery_home"
          cat > "$RUNNER_TEMP/factoryos-ci-recovery-key.params" <<'GPG'
          Key-Type: RSA
          Key-Length: 3072
          Key-Usage: sign cert
          Subkey-Type: RSA
          Subkey-Length: 3072
          Subkey-Usage: encrypt
          Name-Real: FactoryOS CI Recovery Rehearsal
          Name-Email: factoryos-ci-recovery@example.invalid
          Expire-Date: 1d
          %no-protection
          %commit
          GPG
          gpg --batch --generate-key "$RUNNER_TEMP/factoryos-ci-recovery-key.params"
          recovery_recipient="$(gpg --with-colons --list-keys factoryos-ci-recovery@example.invalid | awk -F: '$1=="fpr" {print $10; exit}')"
          if [[ -z "$recovery_recipient" ]]; then
            echo "::error::Could not create an ephemeral GPG recovery recipient"
            exit 1
          fi

          cat > "$RUNNER_TEMP/factoryos-recovery.pg_service.conf" <<'PGSERVICE'
          [factoryos-ci-source]
          host=127.0.0.1
          port=5432
          dbname=factoryos_test
          user=postgres
          password=ci-postgres-only
          connect_timeout=5

          [factoryos-ci-restore]
          host=127.0.0.1
          port=5432
          dbname=factoryos_recovery_restore_test_ci
          user=postgres
          password=ci-postgres-only
          connect_timeout=5
          PGSERVICE
          chmod 600 "$RUNNER_TEMP/factoryos-recovery.pg_service.conf"
          psql "postgresql://postgres@127.0.0.1:5432/postgres" -v ON_ERROR_STOP=1 \
            -c 'CREATE DATABASE factoryos_recovery_restore_test_ci'
          psql "postgresql://postgres@127.0.0.1:5432/postgres" -v ON_ERROR_STOP=1 \
            -c 'GRANT CONNECT ON DATABASE factoryos_recovery_restore_test_ci TO factoryos_app'
          PGSERVICEFILE="$RUNNER_TEMP/factoryos-recovery.pg_service.conf" \
          GNUPGHOME="$GNUPGHOME" \
          FACTORYOS_DR_MODE=RELEASE_GATE \
          FACTORYOS_MIGRATION_MANIFEST_MODE=IDEMPOTENT_REPLAY \
          FACTORYOS_DR_APPLICATION_DATABASE_URL="postgresql://factoryos_app:ci-app-only@127.0.0.1:5432/factoryos_recovery_restore_test_ci" \
          FACTORYOS_BACKUP_PGSERVICE=factoryos-ci-source \
          FACTORYOS_RESTORE_PGSERVICE=factoryos-ci-restore \
          FACTORYOS_BACKUP_OUTPUT="$recovery_backup_dir/factoryos-ci-recovery.dump.gpg" \
          FACTORYOS_BACKUP_GPG_RECIPIENT="$recovery_recipient" \
          FACTORYOS_RESTORE_SMOKE_SQL="scripts/recovery/ci-restore-smoke.sql" \
          FACTORYOS_RESTORE_CONFIRM_EMPTY_DATABASE=I_HAVE_VERIFIED_EMPTY \
          FACTORYOS_RECOVERY_EVIDENCE_JSON="$recovery_evidence_dir/ci-restore-receipt.json" \
          FACTORYOS_CANDIDATE_MIGRATION_MANIFEST=scripts/recovery/ci-candidate-migrations.txt \
          FACTORYOS_RECOVERY_WATERMARK_SQL=scripts/recovery/ci-recovery-watermark.sql \
          FACTORYOS_RECOVERY_EVENT_TIME_UTC="$(date -u '+%Y-%m-%dT%H:%M:%SZ')" \
          FACTORYOS_RECOVERY_OPERATOR="GitHub Actions CI" \
          FACTORYOS_RECOVERY_APPROVER="Automated CI contract" \
          FACTORYOS_CANDIDATE_SHA="$GITHUB_SHA" \
          bash scripts/recovery/postgres-backup-restore-rehearsal.sh
          rm -rf "$recovery_home"
          rm -f "$RUNNER_TEMP/factoryos-ci-recovery-key.params" "$RUNNER_TEMP/factoryos-recovery.pg_service.conf"

          # A rehearsal cannot pass this step with missing/unbound migration or rollback evidence.
          receipt_path="$recovery_evidence_dir/ci-restore-receipt.json"
          test -s "$receipt_path"
          node --input-type=module - "$receipt_path" <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const receipt = JSON.parse(readFileSync(process.argv[2], 'utf8'));
          assert.equal(receipt.schema, 'factoryos.disaster-recovery-rehearsal/v1');
          assert.equal(receipt.status, 'TECHNICAL_PASS');
          assert.equal(receipt.databases.distinctIdentityVerified, true);
          assert.equal(receipt.databases.targetWasEmptyBeforeRestore, true);
          assert.match(receipt.backup.sha256, /^[a-f0-9]{64}$/);
          assert.equal(receipt.backup.checksumVerified, true);
          assert.equal(receipt.backup.encryption, 'ENCRYPTED_GPG');
          assert.equal(receipt.backup.archiveReadability, 'READABLE');
          assert.equal(receipt.verification.restoreStatus, 'PASS');
          assert.equal(receipt.candidate.migrationStatus, 'PASS');
          assert.equal(receipt.candidate.migrationManifestMode, 'IDEMPOTENT_REPLAY');
          assert.equal(receipt.candidate.migrationCount, 8);
          assert.match(receipt.candidate.migrationManifestSha256, /^[a-f0-9]{64}$/);
          assert.equal(receipt.candidate.failedTransactionRecoveryStatus, 'PASS');
          assert.equal(receipt.verification.migrationRecoveryStatus, 'PASS');
          assert.equal(receipt.verification.schemaSmokeStatus, 'PASS');
          assert.equal(receipt.verification.applicationSmokeStatus, 'PASS');
          assert.equal(receipt.verification.apiReadinessStatus, 'PASS');
          assert.equal(receipt.verification.tenantIsolationStatus, 'PASS');
          assert.equal(receipt.verification.auditContinuityStatus, 'PASS');
          assert.ok(Number.isSafeInteger(receipt.measured.observedRpoSeconds));
          assert.ok(Number.isSafeInteger(receipt.measured.observedRtoSeconds));
          assert.equal(receipt.operatorSignoff.status, 'PENDING_POST_RUN_REVIEW');
          console.log('RECOVERY_EVIDENCE_RECEIPT_CONTRACT=PASS');
          NODE

          # Deliberately fail after transactional DDL/DML; psql must leave no partial migration state.
          recovery_log="$(mktemp)"
          if psql "postgresql://postgres@127.0.0.1:5432/factoryos_test" \
            -v ON_ERROR_STOP=1 -f services/api/test/migration-recovery-failure.sql >"$recovery_log" 2>&1; then
            cat "$recovery_log"
            rm -f "$recovery_log"
            echo "::error::Intentional failed-migration fixture unexpectedly succeeded"
            exit 1
          fi
          if ! grep -qi "division by zero" "$recovery_log"; then
            cat "$recovery_log"
            rm -f "$recovery_log"
            echo "::error::Migration recovery fixture failed for a reason other than its deliberate error"
            exit 1
          fi
          rm -f "$recovery_log"
          probe_relation="$(psql "postgresql://postgres@127.0.0.1:5432/factoryos_test" -X -qAt -v ON_ERROR_STOP=1 -c "SELECT CASE WHEN to_regclass('public.factoryos_migration_recovery_probe') IS NULL THEN 'absent' ELSE 'present' END")"
          if [[ "$probe_relation" != "absent" ]]; then
            echo "::error::Failed migration left partial DDL behind (probe relation: $probe_relation)"
            exit 1
          fi

          # Production lifecycle contract requires the development admin and factory-manager role grants.
          psql "postgresql://postgres@127.0.0.1:5432/factoryos_test" \
            -v ON_ERROR_STOP=1 -f services/api/test/production-work-order-contract.sql

          echo "Checking manufacturing lifecycle cross-slice PostgreSQL acceptance"
          psql "postgresql://postgres@127.0.0.1:5432/factoryos_test" \
            -v ON_ERROR_STOP=1 -f services/api/test/manufacturing-lifecycle-acceptance.sql

          # This contract also checks demo-role grants, so run it after the development role seeds.
          psql "postgresql://postgres@127.0.0.1:5432/factoryos_test" \
            -v ON_ERROR_STOP=1 -f services/api/test/mrp-lite-planning-contract.sql

          # Migration 163 is first applied before development roles are seeded; replay it here so its role grants
          # are also exercised against the fully seeded test fixture before checking the capacity contract.
          psql "postgresql://postgres@127.0.0.1:5432/factoryos_test" \
            -v ON_ERROR_STOP=1 -f migrations/163_mrp_finite_capacity_planning.sql

          echo "Reapplying advanced quality migration after demo-role seeds to verify quality permission grants"
          psql "postgresql://postgres@127.0.0.1:5432/factoryos_test" \
            -v ON_ERROR_STOP=1 -f migrations/164_quality_advanced_sampling_supplier_pareto.sql

          echo "Checking advanced quality grants for the seeded QUALITY_MANAGER role"
          psql "postgresql://postgres@127.0.0.1:5432/factoryos_test" \
            -v ON_ERROR_STOP=1 -f services/api/test/quality-advanced-role-grants.sql

          echo "Reapplying quality disposition inventory balance guard to verify idempotency"
          psql "postgresql://postgres@127.0.0.1:5432/factoryos_test" \
            -v ON_ERROR_STOP=1 -f migrations/165_quality_disposition_inventory_balance_guard.sql

          echo "Reapplying rework inventory ledger migration to verify idempotency"
          psql "postgresql://postgres@127.0.0.1:5432/factoryos_test" \
            -v ON_ERROR_STOP=1 -f migrations/166_quality_rework_inventory_ledger.sql

          echo "Reapplying sampling binding state guard migration to verify safe schema replay"
          psql "postgresql://postgres@127.0.0.1:5432/factoryos_test" \
            -v ON_ERROR_STOP=1 -f migrations/167_quality_sampling_binding_state_guard.sql

          echo "Checking finite-capacity MRP calendar, scenario and frozen-horizon contracts"
          psql "postgresql://postgres@127.0.0.1:5432/factoryos_test" \
            -v ON_ERROR_STOP=1 -f services/api/test/mrp-finite-capacity-planning-contract.sql

          # B19 tests clone only this dedicated, idle template DB.
          psql "postgresql://postgres@127.0.0.1:5432/postgres" \
            -v ON_ERROR_STOP=1 -c \
            'CREATE DATABASE factoryos_b19_restore_test_ci TEMPLATE factoryos_test'

          psql "postgresql://postgres@127.0.0.1:5432/factoryos_b19_restore_test_ci" \
            -v ON_ERROR_STOP=1 -c \
            "SELECT version FROM schema_migrations WHERE version = '028_ai_execution_claim_reconciliation'"

      - name: Upload sanitized encrypted-restore rehearsal evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dr-rehearsal-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/dr-evidence/ci-restore-receipt.json
          if-no-files-found: warn
          retention-days: 14

      - name: Prepare Jest environment file
        shell: bash
        run: |
          cat > services/api/.env <<'EOF'
          NODE_ENV=test
          PORT=3001
          DATABASE_URL=postgresql://factoryos_app:ci-app-only@127.0.0.1:5432/factoryos_test
          TEST_ADMIN_DATABASE_URL=postgresql://factoryos:ci-admin-only@127.0.0.1:5432/factoryos_test
          B19_TEST_ADMIN_DATABASE_URL=postgresql://postgres:ci-postgres-only@127.0.0.1:5432/factoryos_b19_restore_test_ci
          SAAS_TRANSFER_TARGET_DATABASE_URL=postgresql://factoryos:ci-admin-only@127.0.0.1:5432/factoryos_transfer_target_test_ci
          JWT_SECRET=ci-only-not-a-production-secret
          AUTH_MODE=dev
          DEV_AUTH_ENABLED=false
          DEV_AUTH_SECRET=ci-only-dev-secret
          OUTBOX_DISPATCHER_ENABLED=false
          EOF

      - name: Validate read-only production database role audit query
        env:
          TEST_ADMIN_DATABASE_URL: postgresql://factoryos:ci-admin-only@127.0.0.1:5432/factoryos_test
        run: |
          psql "$TEST_ADMIN_DATABASE_URL" \
            -v ON_ERROR_STOP=1 \
            -v application_role=factoryos_app \
            -v migration_role=factoryos \
            -f deploy/security/postgres-role-audit.sql
          psql "$TEST_ADMIN_DATABASE_URL" -X -qAt -v ON_ERROR_STOP=1 -c \
            "SELECT CASE WHEN rolsuper OR rolcreatedb OR rolcreaterole OR rolreplication OR rolbypassrls THEN 'unsafe' ELSE 'least-privilege-role-flags-pass' END FROM pg_roles WHERE rolname = 'factoryos_app'" \
            | grep -qx 'least-privilege-role-flags-pass'

      - name: Validate recovery rehearsal script syntax
        run: |
          bash -n scripts/recovery/postgres-backup-restore-rehearsal.sh
          node --check scripts/recovery/postgres-backup-restore-rehearsal.test.mjs
          node --check scripts/recovery/application-restore-smoke.mjs
          node --check scripts/recovery/write-rehearsal-evidence.mjs
          node --check scripts/recovery/record-dr-operator-signoff.mjs
          node --check scripts/recovery/rehearsal-evidence.test.mjs
      - name: Run recovery contract tests
        run: node --test scripts/recovery/postgres-backup-restore-rehearsal.test.mjs scripts/recovery/rehearsal-evidence.test.mjs

      - name: Validate production security configuration and harness syntax
        run: |
          node --check scripts/security/production-security-config.test.mjs
          node --test scripts/security/production-security-config.test.mjs

      - name: Validate observability and performance contracts
        run: |
          node --check scripts/performance/api-load-smoke.mjs
          node --check scripts/performance/api-load-smoke.test.mjs
          node --check scripts/performance/api-soak-test.mjs
          node --check scripts/performance/api-soak-test.test.mjs
          node --check scripts/performance/observability-config.test.mjs
          node --test scripts/performance/api-load-smoke.test.mjs scripts/performance/api-soak-test.test.mjs scripts/performance/observability-config.test.mjs

      - name: Lint API
        working-directory: services/api
        run: npm run lint

      - name: Build API
        working-directory: services/api
        run: npm run build

      - name: Start isolated Kafka-compatible Redpanda broker
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name factoryos-redpanda-ci -p 127.0.0.1:19092:19092 \
            docker.redpanda.com/redpandadata/redpanda:v26.2.5 \
            redpanda start \
              --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092 \
              --advertise-kafka-addr internal://factoryos-redpanda-ci:9092,external://localhost:19092 \
              --mode dev-container --smp 1 --memory 1G --reserve-memory 0M
          ready=false
          for attempt in $(seq 1 60); do
            if docker exec factoryos-redpanda-ci rpk cluster info --brokers=127.0.0.1:9092 >/dev/null 2>&1; then
              ready=true
              break
            fi
            sleep 2
          done
          if [[ "$ready" != "true" ]]; then
            docker logs factoryos-redpanda-ci
            echo "::error::Kafka-compatible broker did not become ready"
            exit 1
          fi
          echo "KAFKA_BROKERS=127.0.0.1:19092" >> "$GITHUB_ENV"

      - name: Run full API unit and PostgreSQL integration suite
        working-directory: services/api
        env:
          KAFKA_BROKERS: 127.0.0.1:19092
        run: node --experimental-vm-modules ../../node_modules/jest/bin/jest.js --config ./jest.config.cjs --runInBand

      - name: Stop isolated Kafka-compatible broker
        if: always()
        run: docker rm -f factoryos-redpanda-ci >/dev/null 2>&1 || true


            ('e7140000-0000-4000-8000-000000000002','e7110000-0000-4000-8000-000000000002','e7120000-0000-4000-8000-000000000002','RECOVERY_REHEARSAL','RESTORE_CONTINUITY','TENANT','e7110000-0000-4000-8000-000000000002','INTERNAL','{"fixture":"backup-restore-audit-continuity","tenant":"B"}'::jsonb,clock_timestamp())
          ON CONFLICT (id) DO UPDATE SET payload=EXCLUDED.payload,created_at=EXCLUDED.created_at;
          CREATE TABLE public.factoryos_ci_erasure_replay_fixture (
            fixture_id text PRIMARY KEY,
            tenant_id uuid NOT NULL,
            payload_marker text NOT NULL
          );
          CREATE TABLE public.factoryos_ci_erasure_replay_ledger (
            tombstone_id text PRIMARY KEY,
            fixture_id text NOT NULL,
            tenant_id uuid NOT NULL
          );
          INSERT INTO public.factoryos_ci_erasure_replay_fixture (fixture_id,tenant_id,payload_marker)
          VALUES ('ci-restore-erasure-row-001','e7110000-0000-4000-8000-000000000001','MUST_NOT_REAPPEAR_AFTER_RESTORE');
          INSERT INTO public.factoryos_ci_erasure_replay_ledger (tombstone_id,fixture_id,tenant_id)
          VALUES ('ci-tombstone-after-snapshot-001','ci-restore-erasure-row-001','e7110000-0000-4000-8000-000000000001');
          COMMIT;
          SQL

          # This end-to-end check uses only an ephemeral CI database and a one-run GPG key.
          # The encrypted dump and private key remain on the runner and are never uploaded.
          recovery_home="$(mktemp -d)"
          recovery_backup_dir="$RUNNER_TEMP/dr-backups"
          recovery_evidence_dir="$RUNNER_TEMP/dr-evidence"
          mkdir -m 700 -p "$recovery_backup_dir" "$recovery_evidence_dir"
          chmod 700 "$recovery_home"
          export GNUPGHOME="$recovery_home"
          cat > "$RUNNER_TEMP/factoryos-ci-recovery-key.params" <<'GPG'
          Key-Type: RSA
          Key-Length: 3072
          Key-Usage: sign cert
          Subkey-Type: RSA
          Subkey-Length: 3072
          Subkey-Usage: encrypt
          Name-Real: FactoryOS CI Recovery Rehearsal
          Name-Email: factoryos-ci-recovery@example.invalid
          Expire-Date: 1d
          %no-protection
          %commit
          GPG
          gpg --batch --generate-key "$RUNNER_TEMP/factoryos-ci-recovery-key.params"
          recovery_recipient="$(gpg --with-colons --list-keys factoryos-ci-recovery@example.invalid | awk -F: '$1=="fpr" {print $10; exit}')"
          if [[ -z "$recovery_recipient" ]]; then
            echo "::error::Could not create an ephemeral GPG recovery recipient"
            exit 1
          fi

          cat > "$RUNNER_TEMP/factoryos-recovery.pg_service.conf" <<'PGSERVICE'
          [factoryos-ci-source]
          host=127.0.0.1
          port=5432
          dbname=factoryos_test
          user=postgres
          password=ci-postgres-only
          connect_timeout=5

          [factoryos-ci-restore]
          host=127.0.0.1
          port=5432
          dbname=factoryos_recovery_restore_test_ci
          user=postgres
          password=ci-postgres-only
          connect_timeout=5
          PGSERVICE
          chmod 600 "$RUNNER_TEMP/factoryos-recovery.pg_service.conf"
          erasure_ledger_sha256="$(sha256sum scripts/recovery/ci-erasure-tombstone-ledger.jsonl | awk '{print $1}')"
          export FACTORYOS_CI_EXPECTED_ERASURE_LEDGER_SHA256="$erasure_ledger_sha256"
          psql "postgresql://postgres@127.0.0.1:5432/postgres" -v ON_ERROR_STOP=1 \
            -c 'CREATE DATABASE factoryos_recovery_restore_test_ci'
          psql "postgresql://postgres@127.0.0.1:5432/postgres" -v ON_ERROR_STOP=1 \
            -c 'GRANT CONNECT ON DATABASE factoryos_recovery_restore_test_ci TO factoryos_app'
          PGSERVICEFILE="$RUNNER_TEMP/factoryos-recovery.pg_service.conf" \
          GNUPGHOME="$GNUPGHOME" \
          FACTORYOS_DR_MODE=RELEASE_GATE \
          FACTORYOS_MIGRATION_MANIFEST_MODE=IDEMPOTENT_REPLAY \
          FACTORYOS_DR_APPLICATION_DATABASE_URL="postgresql://factoryos_app:ci-app-only@127.0.0.1:5432/factoryos_recovery_restore_test_ci" \
          FACTORYOS_BACKUP_PGSERVICE=factoryos-ci-source \
          FACTORYOS_RESTORE_PGSERVICE=factoryos-ci-restore \
          FACTORYOS_BACKUP_OUTPUT="$recovery_backup_dir/factoryos-ci-recovery.dump.gpg" \
          FACTORYOS_BACKUP_GPG_RECIPIENT="$recovery_recipient" \
          FACTORYOS_RESTORE_SMOKE_SQL="scripts/recovery/ci-restore-smoke.sql" \
          FACTORYOS_RESTORE_CONFIRM_EMPTY_DATABASE=I_HAVE_VERIFIED_EMPTY \
          FACTORYOS_RECOVERY_EVIDENCE_JSON="$recovery_evidence_dir/ci-restore-receipt.json" \
          FACTORYOS_CANDIDATE_MIGRATION_MANIFEST=scripts/recovery/ci-candidate-migrations.txt \
          FACTORYOS_RECOVERY_WATERMARK_SQL=scripts/recovery/ci-recovery-watermark.sql \
          FACTORYOS_RECOVERY_EVENT_TIME_UTC="$(date -u '+%Y-%m-%dT%H:%M:%SZ')" \
          FACTORYOS_RECOVERY_OPERATOR="GitHub Actions CI" \
          FACTORYOS_RECOVERY_APPROVER="Automated CI contract" \
          FACTORYOS_CANDIDATE_SHA="$GITHUB_SHA" \
          FACTORYOS_RESTORE_ERASURE_REPLAY_SQL="$GITHUB_WORKSPACE/scripts/recovery/ci-erasure-tombstone-replay.sql" \
          FACTORYOS_RESTORE_ERASURE_VERIFY_SQL="$GITHUB_WORKSPACE/scripts/recovery/ci-erasure-tombstone-verify.sql" \
          FACTORYOS_RESTORE_ERASURE_LEDGER_REFERENCE=ci-erasure-ledger-fixture-v1 \
          FACTORYOS_RESTORE_ERASURE_LEDGER_SHA256="$erasure_ledger_sha256" \
          bash scripts/recovery/postgres-backup-restore-rehearsal.sh
          rm -rf "$recovery_home"
          rm -f "$RUNNER_TEMP/factoryos-ci-recovery-key.params" "$RUNNER_TEMP/factoryos-recovery.pg_service.conf"

          # A rehearsal cannot pass this step with missing/unbound migration or rollback evidence.
          receipt_path="$recovery_evidence_dir/ci-restore-receipt.json"
          test -s "$receipt_path"
          node --input-type=module - "$receipt_path" <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const receipt = JSON.parse(readFileSync(process.argv[2], 'utf8'));
          assert.equal(receipt.schema, 'factoryos.disaster-recovery-rehearsal/v1');
          assert.equal(receipt.status, 'TECHNICAL_PASS');
          assert.equal(receipt.databases.distinctIdentityVerified, true);
          assert.equal(receipt.databases.targetWasEmptyBeforeRestore, true);
          assert.match(receipt.backup.sha256, /^[a-f0-9]{64}$/);
          assert.equal(receipt.backup.checksumVerified, true);
          assert.equal(receipt.backup.encryption, 'ENCRYPTED_GPG');
          assert.equal(receipt.backup.archiveReadability, 'READABLE');
          assert.equal(receipt.verification.restoreStatus, 'PASS');
          assert.equal(receipt.candidate.migrationStatus, 'PASS');
          assert.equal(receipt.candidate.migrationManifestMode, 'IDEMPOTENT_REPLAY');
          assert.equal(receipt.candidate.migrationCount, 8);
          assert.match(receipt.candidate.migrationManifestSha256, /^[a-f0-9]{64}$/);
          assert.equal(receipt.candidate.failedTransactionRecoveryStatus, 'PASS');
          assert.equal(receipt.verification.migrationRecoveryStatus, 'PASS');
          assert.equal(receipt.verification.schemaSmokeStatus, 'PASS');
          assert.equal(receipt.verification.applicationSmokeStatus, 'PASS');
          assert.equal(receipt.verification.apiReadinessStatus, 'PASS');
          assert.equal(receipt.verification.tenantIsolationStatus, 'PASS');
          assert.equal(receipt.verification.auditContinuityStatus, 'PASS');
          assert.equal(receipt.verification.erasureReplayStatus, 'PASS');
          assert.equal(receipt.verification.erasureReplayLedgerReference, 'ci-erasure-ledger-fixture-v1');
          assert.equal(receipt.verification.erasureReplayLedgerSha256, process.env.FACTORYOS_CI_EXPECTED_ERASURE_LEDGER_SHA256);
          assert.equal(receipt.verification.erasureReplayRequests, 1);
          assert.equal(receipt.verification.erasureVerificationRequests, 1);
          assert.equal(receipt.verification.erasureVerificationResiduals, 0);
          assert.equal(receipt.verification.erasureReplayResiduals, 0);
          assert.equal(receipt.verification.erasureVerificationMethod, 'INDEPENDENT_READ_ONLY');
          assert.match(receipt.verification.erasureReplaySqlSha256, /^[a-f0-9]{64}$/);
          assert.match(receipt.verification.erasureVerificationSqlSha256, /^[a-f0-9]{64}$/);
          assert.ok(Number.isSafeInteger(receipt.measured.observedRpoSeconds));
          assert.ok(Number.isSafeInteger(receipt.measured.observedRtoSeconds));
          assert.equal(receipt.operatorSignoff.status, 'PENDING_POST_RUN_REVIEW');
          console.log('RECOVERY_EVIDENCE_RECEIPT_CONTRACT=PASS');
          NODE

          # Deliberately fail after transactional DDL/DML; psql must leave no partial migration state.
          recovery_log="$(mktemp)"
          if psql "postgresql://postgres@127.0.0.1:5432/factoryos_test" \
            -v ON_ERROR_STOP=1 -f services/api/test/migration-recovery-failure.sql >"$recovery_log" 2>&1; then
            cat "$recovery_log"
            rm -f "$recovery_log"
            echo "::error::Intentional failed-migration fixture unexpectedly succeeded"
            exit 1
          fi
          if ! grep -qi "division by zero" "$recovery_log"; then
            cat "$recovery_log"
            rm -f "$recovery_log"
            echo "::error::Migration recovery fixture failed for a reason other than its deliberate error"
            exit 1
          fi
          rm -f "$recovery_log"
          probe_relation="$(psql "postgresql://postgres@127.0.0.1:5432/factoryos_test" -X -qAt -v ON_ERROR_STOP=1 -c "SELECT CASE WHEN to_regclass('public.factoryos_migration_recovery_probe') IS NULL THEN 'absent' ELSE 'present' END")"
          if [[ "$probe_relation" != "absent" ]]; then
            echo "::error::Failed migration left partial DDL behind (probe relation: $probe_relation)"
            exit 1
          fi

          # Production lifecycle contract requires the development admin and factory-manager role grants.
          psql "postgresql://postgres@127.0.0.1:5432/factoryos_test" \
            -v ON_ERROR_STOP=1 -f services/api/test/production-work-order-contract.sql

          echo "Checking manufacturing lifecycle cross-slice PostgreSQL acceptance"
          psql "postgresql://postgres@127.0.0.1:5432/factoryos_test" \
            -v ON_ERROR_STOP=1 -f services/api/test/manufacturing-lifecycle-acceptance.sql

          # This contract also checks demo-role grants, so run it after the development role seeds.
          psql "postgresql://postgres@127.0.0.1:5432/factoryos_test" \
            -v ON_ERROR_STOP=1 -f services/api/test/mrp-lite-planning-contract.sql

          # Migration 163 is first applied before development roles are seeded; replay it here so its role grants
          # are also exercised against the fully seeded test fixture before checking the capacity contract.
          psql "postgresql://postgres@127.0.0.1:5432/factoryos_test" \
            -v ON_ERROR_STOP=1 -f migrations/163_mrp_finite_capacity_planning.sql

          echo "Reapplying advanced quality migration after demo-role seeds to verify quality permission grants"
          psql "postgresql://postgres@127.0.0.1:5432/factoryos_test" \
            -v ON_ERROR_STOP=1 -f migrations/164_quality_advanced_sampling_supplier_pareto.sql

          echo "Checking advanced quality grants for the seeded QUALITY_MANAGER role"
          psql "postgresql://postgres@127.0.0.1:5432/factoryos_test" \
            -v ON_ERROR_STOP=1 -f services/api/test/quality-advanced-role-grants.sql

          echo "Reapplying quality disposition inventory balance guard to verify idempotency"
          psql "postgresql://postgres@127.0.0.1:5432/factoryos_test" \
            -v ON_ERROR_STOP=1 -f migrations/165_quality_disposition_inventory_balance_guard.sql

          echo "Reapplying rework inventory ledger migration to verify idempotency"
          psql "postgresql://postgres@127.0.0.1:5432/factoryos_test" \
            -v ON_ERROR_STOP=1 -f migrations/166_quality_rework_inventory_ledger.sql

          echo "Reapplying sampling binding state guard migration to verify safe schema replay"
          psql "postgresql://postgres@127.0.0.1:5432/factoryos_test" \
            -v ON_ERROR_STOP=1 -f migrations/167_quality_sampling_binding_state_guard.sql

          # Migrations 165/166 redefine factoryos_quality_guard_inventory_issue().
          # Therefore 207-212 must be replayed AFTER those legacy quality idempotency checks,
          # otherwise the older item-wide issue guard silently overwrites the shipment leaf-scope fix. Migration 212 then governs verified rework lineage.
          echo "Reapplying final make-to-order and shipment quality-hold guards after legacy quality migrations"
          psql "postgresql://postgres@127.0.0.1:5432/factoryos_test" -v ON_ERROR_STOP=1 -f migrations/207_production_order_finished_good_reservation_boundary.sql
          psql "postgresql://postgres@127.0.0.1:5432/factoryos_test" -v ON_ERROR_STOP=1 -f migrations/208_wms_traceability_scoped_quality_holds.sql
          psql "postgresql://postgres@127.0.0.1:5432/factoryos_test" -v ON_ERROR_STOP=1 -f migrations/209_wms_scoped_quality_hold_guards.sql
          psql "postgresql://postgres@127.0.0.1:5432/factoryos_test" -v ON_ERROR_STOP=1 -f migrations/210_quality_guard_wms_shipment_leaf_holds.sql
          psql "postgresql://postgres@127.0.0.1:5432/factoryos_test" -v ON_ERROR_STOP=1 -f migrations/211_quality_guard_wms_shipment_hold_scope.sql
          psql "postgresql://postgres@127.0.0.1:5432/factoryos_test" -v ON_ERROR_STOP=1 -f migrations/212_quality_rework_genealogy_link_guard.sql

          echo "Checking finite-capacity MRP calendar, scenario and frozen-horizon contracts"
          psql "postgresql://postgres@127.0.0.1:5432/factoryos_test" \
            -v ON_ERROR_STOP=1 -f services/api/test/mrp-finite-capacity-planning-contract.sql

          # B19 tests clone only this dedicated, idle template DB.
          psql "postgresql://postgres@127.0.0.1:5432/postgres" \
            -v ON_ERROR_STOP=1 -c \
            'CREATE DATABASE factoryos_b19_restore_test_ci TEMPLATE factoryos_test'

          psql "postgresql://postgres@127.0.0.1:5432/factoryos_b19_restore_test_ci" \
            -v ON_ERROR_STOP=1 -c \
            "SELECT version FROM schema_migrations WHERE version = '028_ai_execution_claim_reconciliation'"

      - name: Upload sanitized encrypted-restore rehearsal evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dr-rehearsal-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/dr-evidence/ci-restore-receipt.json
          if-no-files-found: warn
          retention-days: 14

      - name: Prepare Jest environment file
        shell: bash
        run: |
          cat > services/api/.env <<'EOF'
          NODE_ENV=test
          PORT=3001
          DATABASE_URL=postgresql://factoryos_app:ci-app-only@127.0.0.1:5432/factoryos_test
          TEST_ADMIN_DATABASE_URL=postgresql://factoryos:ci-admin-only@127.0.0.1:5432/factoryos_test
          B19_TEST_ADMIN_DATABASE_URL=postgresql://postgres:ci-postgres-only@127.0.0.1:5432/factoryos_b19_restore_test_ci
          SAAS_TRANSFER_TARGET_DATABASE_URL=postgresql://factoryos:ci-admin-only@127.0.0.1:5432/factoryos_transfer_target_test_ci
          JWT_SECRET=ci-only-not-a-production-secret
          AUTH_MODE=dev
          DEV_AUTH_ENABLED=false
          DEV_AUTH_SECRET=ci-only-dev-secret
          OUTBOX_DISPATCHER_ENABLED=false
          EOF

      - name: Validate read-only production database role audit query
        env:
          TEST_ADMIN_DATABASE_URL: postgresql://factoryos:ci-admin-only@127.0.0.1:5432/factoryos_test
        run: |
          psql "$TEST_ADMIN_DATABASE_URL" \
            -v ON_ERROR_STOP=1 \
            -v application_role=factoryos_app \
            -v migration_role=factoryos \
            -f deploy/security/postgres-role-audit.sql
          psql "$TEST_ADMIN_DATABASE_URL" -X -qAt -v ON_ERROR_STOP=1 -c \
            "SELECT CASE WHEN rolsuper OR rolcreatedb OR rolcreaterole OR rolreplication OR rolbypassrls THEN 'unsafe' ELSE 'least-privilege-role-flags-pass' END FROM pg_roles WHERE rolname = 'factoryos_app'" \
            | grep -qx 'least-privilege-role-flags-pass'

      - name: Validate recovery rehearsal script syntax
        run: |
          bash -n scripts/recovery/postgres-backup-restore-rehearsal.sh
          node --check scripts/recovery/postgres-backup-restore-rehearsal.test.mjs
          node --check scripts/recovery/application-restore-smoke.mjs
          node --check scripts/recovery/write-rehearsal-evidence.mjs
          node --check scripts/recovery/record-dr-operator-signoff.mjs
          node --check scripts/recovery/rehearsal-evidence.test.mjs
      - name: Run recovery contract tests
        run: node --test scripts/recovery/postgres-backup-restore-rehearsal.test.mjs scripts/recovery/rehearsal-evidence.test.mjs

      - name: Validate production security configuration and harness syntax
        run: |
          node --check scripts/security/production-security-config.test.mjs
          node --test scripts/security/production-security-config.test.mjs

      - name: Validate observability and performance contracts
        run: |
          node --check scripts/performance/api-load-smoke.mjs
          node --check scripts/performance/api-load-smoke.test.mjs
          node --check scripts/performance/api-soak-test.mjs
          node --check scripts/performance/api-soak-test.test.mjs
          node --check scripts/performance/observability-config.test.mjs
          node --test scripts/performance/api-load-smoke.test.mjs scripts/performance/api-soak-test.test.mjs scripts/performance/observability-config.test.mjs

      - name: Lint API
        working-directory: services/api
        run: npm run lint

      - name: Build API
        working-directory: services/api
        run: npm run build

      - name: Start isolated Kafka-compatible Redpanda broker
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name factoryos-redpanda-ci -p 127.0.0.1:19092:19092 \
            docker.redpanda.com/redpandadata/redpanda:v26.2.5 \
            redpanda start \
              --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092 \
              --advertise-kafka-addr internal://factoryos-redpanda-ci:9092,external://localhost:19092 \
              --mode dev-container --smp 1 --memory 1G --reserve-memory 0M
          ready=false
          for attempt in $(seq 1 60); do
            if docker exec factoryos-redpanda-ci rpk cluster info --brokers=127.0.0.1:9092 >/dev/null 2>&1; then
              ready=true
              break
            fi
            sleep 2
          done
          if [[ "$ready" != "true" ]]; then
            docker logs factoryos-redpanda-ci
            echo "::error::Kafka-compatible broker did not become ready"
            exit 1
          fi
          echo "KAFKA_BROKERS=127.0.0.1:19092" >> "$GITHUB_ENV"

      - name: Run full API unit and PostgreSQL integration suite
        working-directory: services/api
        env:
          KAFKA_BROKERS: 127.0.0.1:19092
        run: node --experimental-vm-modules ../../node_modules/jest/bin/jest.js --config ./jest.config.cjs --runInBand

      - name: Stop isolated Kafka-compatible broker
        if: always()
        run: docker rm -f factoryos-redpanda-ci >/dev/null 2>&1 || true


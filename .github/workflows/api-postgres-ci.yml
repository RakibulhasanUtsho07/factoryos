name: API PostgreSQL CI

on:
  pull_request:
    paths:
      - 'docs/merge-commit-release-verification-2026-10-20.md'
      - 'services/api/**'
      - 'scripts/performance/**'
      - 'scripts/recovery/**'
      - 'scripts/audit/**'
      - 'migrations/**'
      - 'scripts/seed-dev-iam.sql'
      - 'scripts/seed-dev-factory-manager.sql'
      - '.github/workflows/api-postgres-ci.yml'
      - '.github/workflows/api-ci.yml'
      - 'package.json'
      - 'package-lock.json'
  push:
    branches: [main, dev, rakibul-hasan]
    paths:
      - 'docs/merge-commit-release-verification-2026-10-20.md'
      - 'services/api/**'
      - 'scripts/performance/**'
      - 'scripts/recovery/**'
      - 'scripts/audit/**'
      - 'migrations/**'
      - 'scripts/seed-dev-iam.sql'
      - 'scripts/seed-dev-factory-manager.sql'
      - '.github/workflows/api-postgres-ci.yml'
      - '.github/workflows/api-ci.yml'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read

concurrency:
  group: api-postgres-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-postgres-only
          POSTGRES_DB: factoryos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d factoryos_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://factoryos_app:ci-app-only@127.0.0.1:5432/factoryos_test
      TEST_APP_DATABASE_URL: postgresql://factoryos_app:ci-app-only@127.0.0.1:5432/factoryos_test
      TEST_ADMIN_DATABASE_URL: postgresql://factoryos:ci-admin-only@127.0.0.1:5432/factoryos_test
      B19_TEST_ADMIN_DATABASE_URL: postgresql://postgres:ci-postgres-only@127.0.0.1:5432/factoryos_b19_restore_test_ci
      SAAS_TRANSFER_TARGET_DATABASE_URL: postgresql://factoryos:ci-admin-only@127.0.0.1:5432/factoryos_transfer_target_test_ci
      JWT_SECRET: ci-only-not-a-production-secret
      NODE_ENV: test
      PORT: 3001
      AUTH_MODE: dev
      DEV_AUTH_ENABLED: 'false'
      DEV_AUTH_SECRET: ci-only-dev-secret
      OUTBOX_DISPATCHER_ENABLED: 'false'

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Initialize isolated PostgreSQL test database
        shell: bash
        run: |
          set -euo pipefail
          export PGPASSWORD=ci-postgres-only

          # These numbered files are not a simple lexical sequence:
          # 003_outbox_event_envelope alters outbox_events created by 004_orders_outbox.
          # Validate the canonical ordered migration list, its inventory, and its SHA-256 before applying DDL.
          node scripts/audit/verify-migration-manifest.mjs
          mapfile -t migrations < <(grep -Ev '^[[:space:]]*(#|$)' scripts/audit/migration-manifest.txt)

          for migration in "${migrations[@]}"; do
            echo "Applying $migration"
            psql "postgresql://postgres@127.0.0.1:5432/factoryos_test" \
              -v ON_ERROR_STOP=1 -f "$migration"
          done

          echo "Reapplying forecast evaluation migration to verify idempotent policy and trigger installation"
          psql "postgresql://postgres@127.0.0.1:5432/factoryos_test" \
            -v ON_ERROR_STOP=1 -f migrations/151_growth_forecast_evaluation_calibration.sql

          echo "Reapplying agent retry migration to verify idempotent trigger and constraint installation"
          psql "postgresql://postgres@127.0.0.1:5432/factoryos_test" \
            -v ON_ERROR_STOP=1 -f migrations/152_ai_agent_retry_backoff.sql

          echo "Reapplying SaaS monetary precision migration to verify idempotent type/constraint installation"
          psql "postgresql://postgres@127.0.0.1:5432/factoryos_test" \
            -v ON_ERROR_STOP=1 -f migrations/153_saas_money_aggregation_precision.sql

          echo "Reapplying SaaS entitlement enforcement migration to verify idempotent policy/trigger installation"
          psql "postgresql://postgres@127.0.0.1:5432/factoryos_test" \
            -v ON_ERROR_STOP=1 -f migrations/154_saas_entitlement_enforcement_modes.sql

          echo "Reapplying SaaS retention/erasure execution migration to verify lifecycle and receipt idempotency"
          psql "postgresql://postgres@127.0.0.1:5432/factoryos_test" \
            -v ON_ERROR_STOP=1 -f migrations/155_saas_retention_execution_and_erasure_receipts.sql

          echo "Reapplying tenant privacy inventory migration to verify RLS policy idempotency"
          psql "postgresql://postgres@127.0.0.1:5432/factoryos_test" \
            -v ON_ERROR_STOP=1 -f migrations/156_tenant_privacy_inventory_and_rls_guardrails.sql

          echo "Reapplying tenant ownership review migration to verify FK-derived policy idempotency"
          psql "postgresql://postgres@127.0.0.1:5432/factoryos_test" \
            -v ON_ERROR_STOP=1 -f migrations/159_tenant_relation_ownership_reviews.sql

          echo "Reapplying OPC UA gateway migration to verify permission and audit contract idempotency"
          psql "postgresql://postgres@127.0.0.1:5432/factoryos_test" \
            -v ON_ERROR_STOP=1 -f migrations/157_ot_opcua_read_gateway.sql

          echo "Reapplying MQTT/Modbus gateway migration to verify permission and audit contract idempotency"
          psql "postgresql://postgres@127.0.0.1:5432/factoryos_test" \
            -v ON_ERROR_STOP=1 -f migrations/158_ot_mqtt_modbus_gateway.sql

          psql "postgresql://postgres@127.0.0.1:5432/factoryos_test" \
            -v ON_ERROR_STOP=1 -f services/api/test/inventory-bin-reservations.sql

          psql "postgresql://postgres@127.0.0.1:5432/factoryos_test" \
            -v ON_ERROR_STOP=1 -f services/api/test/inventory-replenishment.sql

          psql "postgresql://postgres@127.0.0.1:5432/factoryos_test" \
            -v ON_ERROR_STOP=1 -f services/api/test/purchase-order-lifecycle.sql

          psql "postgresql://postgres@127.0.0.1:5432/factoryos_test" \
            -v ON_ERROR_STOP=1 -f services/api/test/goods-receipt.sql

          psql "postgresql://postgres@127.0.0.1:5432/factoryos_test" \
            -v ON_ERROR_STOP=1 -f services/api/test/traceability.sql
          psql "postgresql://postgres@127.0.0.1:5432/factoryos_test" \
            -v ON_ERROR_STOP=1 -f services/api/test/quality-management-contract.sql


          psql "postgresql://postgres@127.0.0.1:5432/factoryos_test" \
            -v ON_ERROR_STOP=1 -f services/api/test/uom-conversion.sql

          psql "postgresql://postgres@127.0.0.1:5432/factoryos_test" \
            -v ON_ERROR_STOP=1 -f services/api/test/product-bom-routing-contract.sql


          # The target importer is tested against a distinct database with the same reviewed schema.
          psql "postgresql://postgres@127.0.0.1:5432/postgres" -v ON_ERROR_STOP=1 -c \
            'CREATE DATABASE factoryos_transfer_target_test_ci'
          for migration in "${migrations[@]}"; do
            echo "Applying target $migration"
            psql "postgresql://postgres@127.0.0.1:5432/factoryos_transfer_target_test_ci" \
              -v ON_ERROR_STOP=1 -f "$migration"
          done

          psql "postgresql://postgres@127.0.0.1:5432/factoryos_test" \
            -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE factoryos LOGIN PASSWORD 'ci-admin-only' SUPERUSER CREATEDB CREATEROLE;
          CREATE ROLE factoryos_app LOGIN PASSWORD 'ci-app-only' NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOBYPASSRLS;
          GRANT CONNECT ON DATABASE factoryos_test TO factoryos_app;
          GRANT USAGE ON SCHEMA public TO factoryos_app;
          GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO factoryos_app;
          GRANT USAGE, SELECT, UPDATE ON ALL SEQUENCES IN SCHEMA public TO factoryos_app;
           GRANT EXECUTE ON FUNCTION public.factoryos_resolve_integration_webhook(uuid) TO factoryos_app;
          ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO factoryos_app;
          ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT USAGE, SELECT, UPDATE ON SEQUENCES TO factoryos_app;
          SQL

          psql "postgresql://postgres@127.0.0.1:5432/factoryos_test" \
            -v ON_ERROR_STOP=1 -f scripts/seed-dev-iam.sql
          psql "postgresql://postgres@127.0.0.1:5432/factoryos_test" \
            -v ON_ERROR_STOP=1 -f services/api/test/ci-postgres-seed.sql
          psql "postgresql://postgres@127.0.0.1:5432/factoryos_test" \
            -v ON_ERROR_STOP=1 -f scripts/seed-dev-factory-manager.sql
          # OT protocol permission assertions run after development role/permission seeding.
          psql "postgresql://postgres@127.0.0.1:5432/factoryos_test" \
            -v ON_ERROR_STOP=1 -f services/api/test/ot-opcua-read-contract.sql
          psql "postgresql://postgres@127.0.0.1:5432/factoryos_test" \
            -v ON_ERROR_STOP=1 -f services/api/test/ot-mqtt-modbus-contract.sql
          psql "postgresql://postgres@127.0.0.1:5432/factoryos_test" -v ON_ERROR_STOP=1 -f services/api/test/maintenance-management-contract.sql
          psql "postgresql://postgres@127.0.0.1:5432/factoryos_test" -v ON_ERROR_STOP=1 -f services/api/test/maintenance-lifecycle.sql
          psql "postgresql://postgres@127.0.0.1:5432/factoryos_test" -v ON_ERROR_STOP=1 -f services/api/test/workforce-management-contract.sql
          psql "postgresql://postgres@127.0.0.1:5432/factoryos_test" -v ON_ERROR_STOP=1 -f services/api/test/workforce-lifecycle.sql
          psql "postgresql://postgres@127.0.0.1:5432/factoryos_test" -v ON_ERROR_STOP=1 -f services/api/test/utility-management-contract.sql
          psql "postgresql://postgres@127.0.0.1:5432/factoryos_test" -v ON_ERROR_STOP=1 -f services/api/test/utility-lifecycle.sql
          psql "postgresql://postgres@127.0.0.1:5432/factoryos_test" -v ON_ERROR_STOP=1 -f services/api/test/ehs-management-contract.sql
          psql "postgresql://postgres@127.0.0.1:5432/factoryos_test" -v ON_ERROR_STOP=1 -f services/api/test/ehs-lifecycle.sql
          psql "postgresql://postgres@127.0.0.1:5432/factoryos_test" -v ON_ERROR_STOP=1 -f services/api/test/commercial-quotation.sql
          psql "postgresql://postgres@127.0.0.1:5432/factoryos_test" -v ON_ERROR_STOP=1 -f services/api/test/should-cost.sql
          psql "postgresql://postgres@127.0.0.1:5432/factoryos_test" -v ON_ERROR_STOP=1 -f services/api/test/finance-integration.sql
           psql "postgresql://postgres@127.0.0.1:5432/factoryos_test" -v ON_ERROR_STOP=1 -f services/api/test/outbox-dlq-replay-idempotency.sql
           psql "postgresql://postgres@127.0.0.1:5432/factoryos_test" -v ON_ERROR_STOP=1 -f services/api/test/integration-webhook.sql
           psql "postgresql://postgres@127.0.0.1:5432/factoryos_test" -v ON_ERROR_STOP=1 -f services/api/test/integration-reconciliation.sql
           psql "postgresql://postgres@127.0.0.1:5432/factoryos_test" -v ON_ERROR_STOP=1 -f services/api/test/cbb-evidence-provenance.sql
           psql "postgresql://postgres@127.0.0.1:5432/factoryos_test" -v ON_ERROR_STOP=1 -f services/api/test/cbb-governance.sql
           psql "postgresql://postgres@127.0.0.1:5432/factoryos_test" -v ON_ERROR_STOP=1 -f services/api/test/research-ingestion-provenance.sql
           psql "postgresql://postgres@127.0.0.1:5432/factoryos_test" -v ON_ERROR_STOP=1 -f services/api/test/research-release-lifecycle.sql
          psql "postgresql://postgres@127.0.0.1:5432/factoryos_test" -v ON_ERROR_STOP=1 -f services/api/test/growth-opportunity-governance.sql
          psql "postgresql://postgres@127.0.0.1:5432/factoryos_test" -v ON_ERROR_STOP=1 -f services/api/test/growth-scenario-sets.sql
           psql "postgresql://postgres@127.0.0.1:5432/factoryos_test" -v ON_ERROR_STOP=1 -f services/api/test/growth-experiment-outcomes.sql
           psql "postgresql://postgres@127.0.0.1:5432/factoryos_test" -v ON_ERROR_STOP=1 -f services/api/test/growth-forecast-evaluations.sql
           psql "postgresql://postgres@127.0.0.1:5432/factoryos_test" -v ON_ERROR_STOP=1 -f services/api/test/ai-agent-retry-scheduling.sql
           psql "postgresql://postgres@127.0.0.1:5432/factoryos_test" -v ON_ERROR_STOP=1 -f services/api/test/saas-money-precision.sql
           psql "postgresql://postgres@127.0.0.1:5432/factoryos_test" -v ON_ERROR_STOP=1 -f services/api/test/saas-entitlement-enforcement.sql
           psql "postgresql://postgres@127.0.0.1:5432/factoryos_test" -v ON_ERROR_STOP=1 -f services/api/test/ai-decision-envelope-lifecycle.sql
          psql "postgresql://postgres@127.0.0.1:5432/factoryos_test" -v ON_ERROR_STOP=1 -f services/api/test/ot-device-contract.sql
          psql "postgresql://postgres@127.0.0.1:5432/factoryos_test" -v ON_ERROR_STOP=1 -f services/api/test/saas-data-retention-contract.sql
           psql "postgresql://postgres@127.0.0.1:5432/factoryos_test" -v ON_ERROR_STOP=1 -f services/api/test/saas-tenant-isolation-matrix.sql
           psql "postgresql://postgres@127.0.0.1:5432/factoryos_test" -v ON_ERROR_STOP=1 -f services/api/test/tenant-data-governance-inventory.sql
           psql "postgresql://postgres@127.0.0.1:5432/factoryos_test" -v ON_ERROR_STOP=1 -f services/api/test/tenant-ownership-review.sql

          # Deliberately fail after transactional DDL/DML; psql must leave no partial migration state.
          recovery_log="$(mktemp)"
          if psql "postgresql://postgres@127.0.0.1:5432/factoryos_test" \
            -v ON_ERROR_STOP=1 -f services/api/test/migration-recovery-failure.sql >"$recovery_log" 2>&1; then
            cat "$recovery_log"
            rm -f "$recovery_log"
            echo "::error::Intentional failed-migration fixture unexpectedly succeeded"
            exit 1
          fi
          if ! grep -qi "division by zero" "$recovery_log"; then
            cat "$recovery_log"
            rm -f "$recovery_log"
            echo "::error::Migration recovery fixture failed for a reason other than its deliberate error"
            exit 1
          fi
          rm -f "$recovery_log"
          probe_relation="$(psql "postgresql://postgres@127.0.0.1:5432/factoryos_test" -X -qAt -v ON_ERROR_STOP=1 -c "SELECT CASE WHEN to_regclass('public.factoryos_migration_recovery_probe') IS NULL THEN 'absent' ELSE 'present' END")"
          if [[ "$probe_relation" != "absent" ]]; then
            echo "::error::Failed migration left partial DDL behind (probe relation: $probe_relation)"
            exit 1
          fi

          # Production lifecycle contract requires the development admin and factory-manager role grants.
          psql "postgresql://postgres@127.0.0.1:5432/factoryos_test" \
            -v ON_ERROR_STOP=1 -f services/api/test/production-work-order-contract.sql

          # This contract also checks demo-role grants, so run it after the development role seeds.
          psql "postgresql://postgres@127.0.0.1:5432/factoryos_test" \
            -v ON_ERROR_STOP=1 -f services/api/test/mrp-lite-planning-contract.sql

          # B19 tests clone only this dedicated, idle template DB.
          psql "postgresql://postgres@127.0.0.1:5432/postgres" \
            -v ON_ERROR_STOP=1 -c \
            'CREATE DATABASE factoryos_b19_restore_test_ci TEMPLATE factoryos_test'

          psql "postgresql://postgres@127.0.0.1:5432/factoryos_b19_restore_test_ci" \
            -v ON_ERROR_STOP=1 -c \
            "SELECT version FROM schema_migrations WHERE version = '028_ai_execution_claim_reconciliation'"

      - name: Prepare Jest environment file
        shell: bash
        run: |
          cat > services/api/.env <<'EOF'
          NODE_ENV=test
          PORT=3001
          DATABASE_URL=postgresql://factoryos_app:ci-app-only@127.0.0.1:5432/factoryos_test
          TEST_ADMIN_DATABASE_URL=postgresql://factoryos:ci-admin-only@127.0.0.1:5432/factoryos_test
          B19_TEST_ADMIN_DATABASE_URL=postgresql://postgres:ci-postgres-only@127.0.0.1:5432/factoryos_b19_restore_test_ci
          SAAS_TRANSFER_TARGET_DATABASE_URL=postgresql://factoryos:ci-admin-only@127.0.0.1:5432/factoryos_transfer_target_test_ci
          JWT_SECRET=ci-only-not-a-production-secret
          AUTH_MODE=dev
          DEV_AUTH_ENABLED=false
          DEV_AUTH_SECRET=ci-only-dev-secret
          OUTBOX_DISPATCHER_ENABLED=false
          EOF

      - name: Validate recovery rehearsal script syntax
        run: |
          bash -n scripts/recovery/postgres-backup-restore-rehearsal.sh
          node --check scripts/recovery/postgres-backup-restore-rehearsal.test.mjs
      - name: Validate bounded load-smoke harness syntax
        run: |
          node --check scripts/performance/api-load-smoke.mjs
          node --check scripts/performance/api-load-smoke.test.mjs

      - name: Lint API
        working-directory: services/api
        run: npm run lint

      - name: Build API
        working-directory: services/api
        run: npm run build

      - name: Run full API unit and PostgreSQL integration suite
        working-directory: services/api
        run: node --experimental-vm-modules ../../node_modules/jest/bin/jest.js --config ./jest.config.cjs --runInBand


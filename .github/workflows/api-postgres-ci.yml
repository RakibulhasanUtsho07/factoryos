name: API PostgreSQL CI

on:
  pull_request:
    paths:
      - 'services/api/**'
      - 'migrations/**'
      - 'scripts/seed-dev-iam.sql'
      - 'scripts/seed-dev-factory-manager.sql'
      - '.github/workflows/api-postgres-ci.yml'
      - '.github/workflows/api-ci.yml'
      - 'package.json'
      - 'package-lock.json'
  push:
    branches: [main, dev, rakibul-hasan]
    paths:
      - 'services/api/**'
      - 'migrations/**'
      - 'scripts/seed-dev-iam.sql'
      - 'scripts/seed-dev-factory-manager.sql'
      - '.github/workflows/api-postgres-ci.yml'
      - '.github/workflows/api-ci.yml'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read

concurrency:
  group: api-postgres-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-postgres-only
          POSTGRES_DB: factoryos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d factoryos_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://factoryos_app:ci-app-only@127.0.0.1:5432/factoryos_test
      TEST_APP_DATABASE_URL: postgresql://factoryos_app:ci-app-only@127.0.0.1:5432/factoryos_test
      TEST_ADMIN_DATABASE_URL: postgresql://factoryos:ci-admin-only@127.0.0.1:5432/factoryos_test
      B19_TEST_ADMIN_DATABASE_URL: postgresql://postgres:ci-postgres-only@127.0.0.1:5432/factoryos_b19_restore_test_ci
      SAAS_TRANSFER_TARGET_DATABASE_URL: postgresql://factoryos:ci-admin-only@127.0.0.1:5432/factoryos_transfer_target_test_ci
      JWT_SECRET: ci-only-not-a-production-secret
      NODE_ENV: test
      PORT: 3001
      AUTH_MODE: dev
      DEV_AUTH_ENABLED: 'false'
      DEV_AUTH_SECRET: ci-only-dev-secret
      OUTBOX_DISPATCHER_ENABLED: 'false'

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Initialize isolated PostgreSQL test database
        shell: bash
        run: |
          set -euo pipefail
          export PGPASSWORD=ci-postgres-only

          # These numbered files are not a simple lexical sequence:
          # 003_outbox_event_envelope alters outbox_events created by 004_orders_outbox.
          migrations=(
            migrations/001_init.sql
            migrations/002_auth_identity.sql
            migrations/003_auth_identity_management.sql
            migrations/004_orders_outbox.sql
            migrations/003_outbox_event_envelope.sql
            migrations/004_outbox_dlq_replay.sql
            migrations/005_outbox_dispatcher.sql
            migrations/006_inbox_idempotency.sql
            migrations/007_order_event_projection.sql
            migrations/008_order_idempotency.sql
            migrations/009_tenant_integrity_hardening.sql
            migrations/010_postgres_rls_tenant_context.sql
            migrations/011_entitlement_feature_flags.sql
            migrations/012_admin_control_plane_permissions.sql
            migrations/013_policy_risk_approvals.sql
            migrations/014_cbb_business_model.sql
            migrations/015_cbb_change_promotion.sql
            migrations/016_ai_runtime_wave1.sql
            migrations/017_ai_governed_actions_learning.sql
            migrations/018_ai_tool_registry.sql
            migrations/019_ai_agent_runtime.sql
            migrations/020_ai_agent_catalogue.sql
            migrations/021_ai_agent_execution_scopes.sql
            migrations/022_ai_agent_studio_sandbox.sql
            migrations/023_ai_agent_publication_rollout.sql
            migrations/024_ai_agent_workflow_drafts.sql
            migrations/025_ai_tool_action_binding.sql
            migrations/026_ai_action_binding_integrity.sql
            migrations/026_ai_agent_task_request_fingerprint.sql
            migrations/026_ai_tool_registry_global_write_hardening.sql
            migrations/027_ai_execution_idempotency_claims.sql
            migrations/028_ai_execution_claim_reconciliation.sql
            migrations/029_ai_agent_operational_controls.sql
            migrations/030_ai_agent_language_owner.sql
            migrations/031_ai_agent_evaluation_cases.sql
            migrations/032_ai_agent_execution_evidence.sql
            migrations/033_ai_agent_handoff_contract_immutability.sql
            migrations/034_ai_agent_handoff_lifecycle.sql
            migrations/035_ai_agent_task_contract_immutability.sql
            migrations/036_ai_agent_task_request_hash.sql
            migrations/037_ai_agent_simulation_parent_scope.sql
            migrations/038_inventory_stock_ledger.sql
            migrations/039_research_growth_intelligence.sql
            migrations/040_growth_constraint_gate_unknowns.sql
            migrations/041_growth_outcome_learning_signals.sql
            migrations/042_research_topic_watchlists.sql
            migrations/043_research_growth_iam_permissions.sql
            migrations/044_growth_outcome_result_link_integrity.sql
            migrations/045_saas_usage_metering_reconciliation.sql
            migrations/046_saas_budget_controls.sql
            migrations/047_saas_alerts_provider_costs.sql
            migrations/048_saas_subscription_lifecycle.sql
            migrations/049_saas_sandbox_environments.sql
            migrations/050_saas_release_rollouts.sql
            migrations/051_saas_deployment_profiles.sql
            migrations/052_saas_tenant_export_migration.sql
            migrations/053_saas_tenant_import_receipts.sql
            migrations/054_ai_operational_evaluation.sql
            migrations/055_ai_operational_forecast_accuracy.sql
            migrations/056_ai_operational_evaluation_policies.sql
            migrations/057_ai_operational_forecast_numeric_consistency.sql
            migrations/058_inventory_reservations.sql
            migrations/059_order_line_inventory_binding.sql
            migrations/060_order_material_dispositions.sql
            migrations/061_inventory_stock_reconciliation.sql
            migrations/062_inventory_cycle_count_approval.sql
            migrations/063_order_production_yield_scrap_tracking.sql
            migrations/064_inventory_storage_locations.sql
            migrations/065_inventory_bin_reservations.sql
            migrations/066_inventory_bin_reservation_balance_guard.sql
            migrations/067_supplier_purchase_order_lifecycle.sql
            migrations/068_purchase_order_lifecycle_integrity.sql
            migrations/069_supplier_po_transactional_audit.sql
            migrations/070_purchase_order_actor_binding.sql
            migrations/071_supplier_audit_correlation.sql
            migrations/072_goods_receipt_grn.sql
            migrations/073_grn_stock_posting_guard.sql
            migrations/074_lot_serial_product_genealogy.sql
            migrations/075_uom_conversion_controls.sql
            migrations/076_inventory_movement_uom_snapshot_compatibility.sql
            migrations/077_uom_base_quantity_precision_guard.sql
            migrations/078_multi_bin_order_reservation_allocation.sql
            migrations/079_inventory_bin_balance_deferred_final_state_guard.sql
            migrations/080_inventory_location_directed_policy.sql
            migrations/081_inventory_reorder_replenishment.sql
            migrations/082_product_bom_routing_version_contracts.sql
            migrations/083_product_definition_idempotency_hardening.sql
            migrations/084_product_contract_maker_checker.sql
            migrations/085_product_alternate_retirement_lifecycle.sql
            migrations/086_product_bom_uom_snapshots.sql
            migrations/087_product_bom_contract_retention_guards.sql
            migrations/088_product_version_supersession_and_release_readiness.sql
            migrations/089_mrp_lite_material_planning.sql
            migrations/090_production_work_order_operation_lifecycle.sql
            migrations/091_production_output_inventory_posting.sql
            migrations/092_order_production_report_work_order_routing_guard.sql
            migrations/093_quality_inspection_ncr_holds_disposition.sql
            migrations/094_quality_inspection_plans_and_results.sql
            migrations/095_quality_ncr_resolution_gate.sql
            migrations/096_quality_capa_action_lifecycle.sql
            migrations/097_quality_defect_order_traceability.sql
            migrations/098_quality_rework_execution_and_verification.sql
            migrations/099_maintenance_assets_and_pm_plans.sql
            migrations/100_maintenance_work_orders_and_spares.sql
            migrations/101_maintenance_lifecycle_audit_guards.sql
            migrations/102_workforce_shift_attendance_productivity.sql
            migrations/103_workforce_lifecycle_audit_guards.sql
            migrations/104_workforce_command_idempotency.sql
            migrations/105_workforce_self_service_role.sql
            migrations/106_workforce_consent_timeline_and_output_attribution.sql
            migrations/107_workforce_shift_revision_and_attendance_corrections.sql
            migrations/108_energy_utility_events.sql
            migrations/109_utility_lifecycle_cost_and_audit_guards.sql
            migrations/110_ehs_safety_permits_incidents_actions.sql
            migrations/111_ehs_lifecycle_safety_guards.sql
            migrations/112_commercial_quotation_lifecycle.sql
            migrations/113_deterministic_should_cost_engine.sql
            migrations/114_finance_integration_contract.sql
            migrations/115_finance_file_import_metadata.sql
            migrations/116_finance_file_import_metadata_integrity.sql
            migrations/117_outbox_dlq_replay_idempotency.sql
            migrations/118_outbox_dlq_replay_receipt_guards.sql
            migrations/119_integration_connector_registry.sql
            migrations/120_integration_connector_event_allowlist.sql
            migrations/121_integration_webhook_rate_limits.sql
            migrations/122_integration_receipt_outbox_binding.sql
            migrations/123_finance_file_exchange_validation_reports.sql
            migrations/124_finance_file_import_validation_reports.sql
            migrations/125_finance_file_import_report_commit.sql
            migrations/126_finance_file_export_receipts.sql
            migrations/127_finance_file_export_permission.sql
            migrations/128_finance_erp_transfer_modes.sql
            migrations/129_finance_erp_export_receipt_guard.sql
            migrations/130_integration_operational_reconciliation.sql
            migrations/131_cbb_evidence_provenance.sql
            migrations/132_cbb_governance.sql
            migrations/133_cbb_terminology_context.sql
          )

          # Fail closed if a SQL migration is added to the repository but omitted
          # from the disposable PostgreSQL CI schema build.
          declare -A configured_migrations=()
          for migration in "${migrations[@]}"; do
            if [[ ! -f "$migration" ]]; then
              echo "::error::Configured migration does not exist: $migration"
              exit 1
            fi
            configured_migrations["$migration"]=1
          done

          missing_migrations=()
          while IFS= read -r migration; do
            if [[ -z "${configured_migrations[$migration]+x}" ]]; then
              missing_migrations+=("$migration")
            fi
          done < <(find migrations -maxdepth 1 -type f -name '*.sql' -print | sort)

          if (("${#missing_migrations[@]}" > 0)); then
            printf '::error::Migrations omitted from PostgreSQL CI: %s\n' "${missing_migrations[*]}"
            exit 1
          fi

          for migration in "${migrations[@]}"; do
            echo "Applying $migration"
            psql "postgresql://postgres@127.0.0.1:5432/factoryos_test" \
              -v ON_ERROR_STOP=1 -f "$migration"
          done

          psql "postgresql://postgres@127.0.0.1:5432/factoryos_test" \
            -v ON_ERROR_STOP=1 -f services/api/test/inventory-bin-reservations.sql

          psql "postgresql://postgres@127.0.0.1:5432/factoryos_test" \
            -v ON_ERROR_STOP=1 -f services/api/test/inventory-replenishment.sql

          psql "postgresql://postgres@127.0.0.1:5432/factoryos_test" \
            -v ON_ERROR_STOP=1 -f services/api/test/purchase-order-lifecycle.sql

          psql "postgresql://postgres@127.0.0.1:5432/factoryos_test" \
            -v ON_ERROR_STOP=1 -f services/api/test/goods-receipt.sql

          psql "postgresql://postgres@127.0.0.1:5432/factoryos_test" \
            -v ON_ERROR_STOP=1 -f services/api/test/traceability.sql
          psql "postgresql://postgres@127.0.0.1:5432/factoryos_test" \
            -v ON_ERROR_STOP=1 -f services/api/test/quality-management-contract.sql


          psql "postgresql://postgres@127.0.0.1:5432/factoryos_test" \
            -v ON_ERROR_STOP=1 -f services/api/test/uom-conversion.sql

          psql "postgresql://postgres@127.0.0.1:5432/factoryos_test" \
            -v ON_ERROR_STOP=1 -f services/api/test/product-bom-routing-contract.sql


          # The target importer is tested against a distinct database with the same reviewed schema.
          psql "postgresql://postgres@127.0.0.1:5432/postgres" -v ON_ERROR_STOP=1 -c \
            'CREATE DATABASE factoryos_transfer_target_test_ci'
          for migration in "${migrations[@]}"; do
            echo "Applying target $migration"
            psql "postgresql://postgres@127.0.0.1:5432/factoryos_transfer_target_test_ci" \
              -v ON_ERROR_STOP=1 -f "$migration"
          done

          psql "postgresql://postgres@127.0.0.1:5432/factoryos_test" \
            -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE factoryos LOGIN PASSWORD 'ci-admin-only' SUPERUSER CREATEDB CREATEROLE;
          CREATE ROLE factoryos_app LOGIN PASSWORD 'ci-app-only' NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOBYPASSRLS;
          GRANT CONNECT ON DATABASE factoryos_test TO factoryos_app;
          GRANT USAGE ON SCHEMA public TO factoryos_app;
          GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO factoryos_app;
          GRANT USAGE, SELECT, UPDATE ON ALL SEQUENCES IN SCHEMA public TO factoryos_app;
           GRANT EXECUTE ON FUNCTION public.factoryos_resolve_integration_webhook(uuid) TO factoryos_app;
          ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO factoryos_app;
          ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT USAGE, SELECT, UPDATE ON SEQUENCES TO factoryos_app;
          SQL

          psql "postgresql://postgres@127.0.0.1:5432/factoryos_test" \
            -v ON_ERROR_STOP=1 -f scripts/seed-dev-iam.sql
          psql "postgresql://postgres@127.0.0.1:5432/factoryos_test" \
            -v ON_ERROR_STOP=1 -f services/api/test/ci-postgres-seed.sql
          psql "postgresql://postgres@127.0.0.1:5432/factoryos_test" \
            -v ON_ERROR_STOP=1 -f scripts/seed-dev-factory-manager.sql
          psql "postgresql://postgres@127.0.0.1:5432/factoryos_test" -v ON_ERROR_STOP=1 -f services/api/test/maintenance-management-contract.sql
          psql "postgresql://postgres@127.0.0.1:5432/factoryos_test" -v ON_ERROR_STOP=1 -f services/api/test/maintenance-lifecycle.sql
          psql "postgresql://postgres@127.0.0.1:5432/factoryos_test" -v ON_ERROR_STOP=1 -f services/api/test/workforce-management-contract.sql
          psql "postgresql://postgres@127.0.0.1:5432/factoryos_test" -v ON_ERROR_STOP=1 -f services/api/test/workforce-lifecycle.sql
          psql "postgresql://postgres@127.0.0.1:5432/factoryos_test" -v ON_ERROR_STOP=1 -f services/api/test/utility-management-contract.sql
          psql "postgresql://postgres@127.0.0.1:5432/factoryos_test" -v ON_ERROR_STOP=1 -f services/api/test/utility-lifecycle.sql
          psql "postgresql://postgres@127.0.0.1:5432/factoryos_test" -v ON_ERROR_STOP=1 -f services/api/test/ehs-management-contract.sql
          psql "postgresql://postgres@127.0.0.1:5432/factoryos_test" -v ON_ERROR_STOP=1 -f services/api/test/ehs-lifecycle.sql
          psql "postgresql://postgres@127.0.0.1:5432/factoryos_test" -v ON_ERROR_STOP=1 -f services/api/test/commercial-quotation.sql
          psql "postgresql://postgres@127.0.0.1:5432/factoryos_test" -v ON_ERROR_STOP=1 -f services/api/test/should-cost.sql
          psql "postgresql://postgres@127.0.0.1:5432/factoryos_test" -v ON_ERROR_STOP=1 -f services/api/test/finance-integration.sql
           psql "postgresql://postgres@127.0.0.1:5432/factoryos_test" -v ON_ERROR_STOP=1 -f services/api/test/outbox-dlq-replay-idempotency.sql
           psql "postgresql://postgres@127.0.0.1:5432/factoryos_test" -v ON_ERROR_STOP=1 -f services/api/test/integration-webhook.sql
           psql "postgresql://postgres@127.0.0.1:5432/factoryos_test" -v ON_ERROR_STOP=1 -f services/api/test/integration-reconciliation.sql
           psql "postgresql://postgres@127.0.0.1:5432/factoryos_test" -v ON_ERROR_STOP=1 -f services/api/test/cbb-evidence-provenance.sql
           psql "postgresql://postgres@127.0.0.1:5432/factoryos_test" -v ON_ERROR_STOP=1 -f services/api/test/cbb-governance.sql

          # Production lifecycle contract requires the development admin and factory-manager role grants.
          psql "postgresql://postgres@127.0.0.1:5432/factoryos_test" \
            -v ON_ERROR_STOP=1 -f services/api/test/production-work-order-contract.sql

          # This contract also checks demo-role grants, so run it after the development role seeds.
          psql "postgresql://postgres@127.0.0.1:5432/factoryos_test" \
            -v ON_ERROR_STOP=1 -f services/api/test/mrp-lite-planning-contract.sql

          # B19 tests clone only this dedicated, idle template DB.
          psql "postgresql://postgres@127.0.0.1:5432/postgres" \
            -v ON_ERROR_STOP=1 -c \
            'CREATE DATABASE factoryos_b19_restore_test_ci TEMPLATE factoryos_test'

          psql "postgresql://postgres@127.0.0.1:5432/factoryos_b19_restore_test_ci" \
            -v ON_ERROR_STOP=1 -c \
            "SELECT version FROM schema_migrations WHERE version = '028_ai_execution_claim_reconciliation'"

      - name: Prepare Jest environment file
        shell: bash
        run: |
          cat > services/api/.env <<'EOF'
          NODE_ENV=test
          PORT=3001
          DATABASE_URL=postgresql://factoryos_app:ci-app-only@127.0.0.1:5432/factoryos_test
          TEST_ADMIN_DATABASE_URL=postgresql://factoryos:ci-admin-only@127.0.0.1:5432/factoryos_test
          B19_TEST_ADMIN_DATABASE_URL=postgresql://postgres:ci-postgres-only@127.0.0.1:5432/factoryos_b19_restore_test_ci
          SAAS_TRANSFER_TARGET_DATABASE_URL=postgresql://factoryos:ci-admin-only@127.0.0.1:5432/factoryos_transfer_target_test_ci
          JWT_SECRET=ci-only-not-a-production-secret
          AUTH_MODE=dev
          DEV_AUTH_ENABLED=false
          DEV_AUTH_SECRET=ci-only-dev-secret
          OUTBOX_DISPATCHER_ENABLED=false
          EOF

      - name: Lint API
        working-directory: services/api
        run: npm run lint

      - name: Build API
        working-directory: services/api
        run: npm run build

      - name: Run full API unit and PostgreSQL integration suite
        working-directory: services/api
        run: node --experimental-vm-modules ../../node_modules/jest/bin/jest.js --config ./jest.config.cjs --runInBand


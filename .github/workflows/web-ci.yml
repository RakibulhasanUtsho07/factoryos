name: Web CI

on:
  pull_request:
    paths:
      - 'docs/merge-commit-release-verification-2026-10-20.md'
      - 'docs/wms-mobile-offline-label-acceptance.md'
      - 'scripts/integrations/wms-barcode-decode-acceptance.mjs'
      - 'apps/web/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/web-ci.yml'
  push:
    branches: [main, dev]
    paths:
      - 'docs/merge-commit-release-verification-2026-10-20.md'
      - 'scripts/integrations/wms-barcode-decode-acceptance.mjs'
      - 'apps/web/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/web-ci.yml'

permissions:
  contents: read

concurrency:
  group: web-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install workspace dependencies
        run: npm ci

      - name: Install independent barcode decoder and SVG rasterizer
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y zbar-tools librsvg2-bin

      - name: Independently decode rendered Code 128 and GS1-128 pixels
        run: node scripts/integrations/wms-barcode-decode-acceptance.mjs

      - name: Test WMS mobile and label contracts
        run: npm --workspace apps/web run test

      - name: Lint web app
        run: npm --workspace apps/web run lint

      - name: Build web app
        run: npm --workspace apps/web run build

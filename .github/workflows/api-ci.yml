name: API CI

on:
  pull_request:
    paths:
      - 'docs/merge-commit-release-verification-2026-10-20.md'
      - 'docs/ai-artifact-provenance-and-production-admission.md'
      - 'docs/ai-provider-live-release-acceptance.md'
      - 'docs/wms-provider-certification.md'
      - 'services/api/**'
      - 'services/edge-agent/**'
      - 'scripts/performance/**'
      - 'scripts/security/**'
      - 'scripts/audit/**'
      - 'scripts/integrations/**'
      - 'deploy/security/**'
      - 'deploy/event-bus/**'
      - 'scripts/event-bus/**'
      - 'docs/production-security-configuration-and-independent-review.md'
      - 'deploy/observability/**'
      - 'docs/central-observability-slo-capacity.md'
      - 'scripts/recovery/**'
      - 'migrations/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/api-ci.yml'
      - '.github/workflows/wms-provider-live-smoke.yml'
  push:
    branches: [main, dev, rakibul-hasan]
    paths:
      - 'docs/merge-commit-release-verification-2026-10-20.md'
      - 'docs/ai-artifact-provenance-and-production-admission.md'
      - 'docs/ai-provider-live-release-acceptance.md'
      - 'docs/wms-provider-certification.md'
      - 'services/api/**'
      - 'services/edge-agent/**'
      - 'scripts/performance/**'
      - 'scripts/security/**'
      - 'scripts/audit/**'
      - 'scripts/integrations/**'
      - 'deploy/security/**'
      - 'docs/production-security-configuration-and-independent-review.md'
      - 'deploy/observability/**'
      - 'docs/central-observability-slo-capacity.md'
      - 'scripts/recovery/**'
      - 'migrations/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/api-ci.yml'
      - '.github/workflows/wms-provider-live-smoke.yml'

permissions:
  contents: read

concurrency:
  group: api-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: factoryos
          POSTGRES_PASSWORD: factoryos
          POSTGRES_DB: factoryos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U factoryos -d factoryos_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Enforce tenant-cache application access boundary
        run: node --test scripts/audit/tenant-cache-access-contract.test.mjs
      - name: Test durable Edge agent spool and package-control sync contracts
        run: node --test services/edge-agent/test/durable-observation-spool.test.mjs services/edge-agent/test/package-control-sync.test.mjs
      - name: Prepare AI Tool Registry RLS integration database
        env:
          PGPASSWORD: factoryos
        run: |
          psql "postgresql://factoryos:factoryos@127.0.0.1:5432/factoryos_test" \
            -v ON_ERROR_STOP=1 \
            -f services/api/test/fixtures/ai-tool-registry-rls-bootstrap.sql
          psql "postgresql://factoryos:factoryos@127.0.0.1:5432/factoryos_test" \
            -v ON_ERROR_STOP=1 \
            -f migrations/026_ai_tool_registry_global_write_hardening.sql
      - name: Verify AI Tool Registry migration is rerunnable
        env:
          PGPASSWORD: factoryos
        run: |
          psql "postgresql://factoryos:factoryos@127.0.0.1:5432/factoryos_test" \
            -v ON_ERROR_STOP=1 \
            -f migrations/026_ai_tool_registry_global_write_hardening.sql
      - name: Prepare isolated API test environment
        shell: bash
        run: |
          cat > services/api/.env <<'EOF'
          NODE_ENV=test
          PORT=3001
          DATABASE_URL=postgresql://factoryos:factoryos@127.0.0.1:5432/factoryos_test
          JWT_SECRET=ci-only-not-a-production-secret
          AUTH_MODE=dev
          DEV_AUTH_ENABLED=false
          EOF
      - name: Validate bounded load and recovery harnesses
        run: |
          node --check scripts/performance/api-load-smoke.mjs
          node --check scripts/performance/api-load-smoke.test.mjs
          node --check scripts/performance/api-soak-test.mjs
          node --check scripts/performance/api-soak-test.test.mjs
          node --check scripts/performance/observability-config.test.mjs
          node --check scripts/security/production-security-config.test.mjs
          node --check scripts/event-bus/provision-kafka-topics.mjs
          node --check scripts/event-bus/staging-fault-injection.mjs
          bash -n scripts/recovery/postgres-backup-restore-rehearsal.sh
      - name: Validate protected WMS provider smoke workflow YAML
        run: ruby -e "require 'yaml'; YAML.parse_file('.github/workflows/wms-provider-live-smoke.yml')"
      - name: Test WMS provider certification smoke harness
        run: |
          node --check scripts/integrations/wms-provider-evidence-pack.mjs
          node --check scripts/integrations/wms-provider-certification.mjs
          node --check scripts/integrations/wms-provider-certification.test.mjs
          node --test scripts/integrations/wms-provider-certification.test.mjs
      - name: Test POD storage policy, evidence redaction, and live-workflow safety
        run: |
          node --check scripts/integrations/wms-storage-iam-policy-check.mjs
          node --check scripts/integrations/wms-storage-iam-policy-check.test.mjs
          node --check scripts/integrations/wms-provider-evidence-safety-check.mjs
          node --check scripts/integrations/wms-provider-evidence-safety-check.test.mjs
          node --check scripts/integrations/wms-provider-live-smoke.workflow.test.mjs
          node --test \
            scripts/integrations/wms-storage-iam-policy-check.test.mjs \
            scripts/integrations/wms-provider-evidence-safety-check.test.mjs \
            scripts/integrations/wms-provider-live-smoke.workflow.test.mjs
      - name: Test bounded load and backup/restore safety contracts
        working-directory: services/api
        run: |
          npm run test:load-smoke:contract
          npm run test:capacity:contract
          npm run test:recovery:contract
          node --test ../../scripts/security/production-security-config.test.mjs
      - name: Lint API
        working-directory: services/api
        run: npm run lint
      - name: Build API
        working-directory: services/api
        run: npm run build
      - name: Run API unit tests
        working-directory: services/api
        run: node --experimental-vm-modules ../../node_modules/jest/bin/jest.js --config ./jest.config.cjs --runInBand --testPathIgnorePatterns='\.integration\.spec\.ts$|\.postgres\.integration\.spec\.ts$'
      - name: Configure isolated Redis erasure-fence persistence
        env:
          CI: "true"
          FACTORYOS_CACHE_URL: redis://127.0.0.1:6379/0
        run: node scripts/integrations/prepare-tenant-cache-redis-ci.mjs
      - name: Run isolated Redis tenant-cache erasure acceptance
        working-directory: services/api
        env:
          NODE_ENV: test
          FACTORYOS_CACHE_URL: redis://127.0.0.1:6379/0
          FACTORYOS_CACHE_CONFIG_REFERENCE: ci-tenant-cache-v1
          FACTORYOS_CACHE_CONNECT_TIMEOUT_MS: 5000
        run: node --experimental-vm-modules ../../node_modules/jest/bin/jest.js --config ./jest.config.cjs --runInBand src/saas/redis-cache-erasure.integration.spec.ts
      - name: Start isolated S3-compatible POD test storage
        run: |
          docker run --detach --name factoryos-pod-storage-ci \
            --publish 9000:9000 \
            --publish 9001:9001 \
            --env RUSTFS_ACCESS_KEY=factoryos-ci-access \
            --env RUSTFS_SECRET_KEY=ci-only-pod-storage-secret-2026 \
            --env RUSTFS_ADDRESS=0.0.0.0:9000 \
            --env RUSTFS_CONSOLE_ADDRESS=0.0.0.0:9001 \
            --env RUSTFS_CONSOLE_ENABLE=false \
            --env RUSTFS_OBS_LOGGER_LEVEL=error \
            rustfs/rustfs:1.0.3 /data
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:9000/health >/dev/null; then
              echo "S3-compatible test storage is healthy"
              exit 0
            fi
            sleep 2
          done
          docker logs factoryos-pod-storage-ci
          exit 1
      - name: Run real S3-compatible POD upload/read-back acceptance
        working-directory: services/api
        env:
          NODE_ENV: test
          WMS_POD_STORAGE_ENDPOINT: http://127.0.0.1:9000
          WMS_POD_STORAGE_BUCKET: factoryos-pod-ci
          WMS_POD_STORAGE_REGION: us-east-1
          WMS_POD_STORAGE_ACCESS_KEY_ID: factoryos-ci-access
          WMS_POD_STORAGE_SECRET_ACCESS_KEY: ci-only-pod-storage-secret-2026
        run: node --experimental-vm-modules ../../node_modules/jest/bin/jest.js --config ./jest.config.cjs --runInBand src/integrations/wms-pod-storage.s3.integration.spec.ts
      - name: Run AI Tool Registry PostgreSQL RLS integration tests
        working-directory: services/api
        env:
          TEST_APP_DATABASE_URL: postgresql://factoryos_test_app:factoryos_test_app@127.0.0.1:5432/factoryos_test
        run: node --experimental-vm-modules ../../node_modules/jest/bin/jest.js --config ./jest.config.cjs --runInBand src/ai/tools/ai.tool.registry.rls.postgres.integration.spec.ts

      - name: Stop isolated S3-compatible POD test storage
        if: always()
        run: docker stop factoryos-pod-storage-ci || true

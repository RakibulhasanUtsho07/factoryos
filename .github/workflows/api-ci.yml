name: FactoryOS API CI

on:
  push:
    branches:
      - main
      - rakibul-hasan
      - 'codex/**'
  pull_request:
    branches:
      - main
      - rakibul-hasan

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint API
        run: npm --workspace services/api run lint

      - name: Build API
        run: npm --workspace services/api run build

      - name: Unit tests
        run: npx jest --config services/api/jest.config.cjs --runInBand --testPathIgnorePatterns=integration
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://factoryos:factoryos_ci_password@localhost:5432/factoryos

      - name: Validate API contract
        run: node -e "const fs=require('fs'); const p='packages/api-contracts/openapi.yaml'; if(!fs.existsSync(p)) process.exit(1); const s=fs.readFileSync(p,'utf8'); if(!s.includes('openapi: 3.1.0')) process.exit(1);"

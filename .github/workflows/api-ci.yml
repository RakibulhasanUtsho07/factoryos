name: API CI

on:
  pull_request:
    paths:
      - 'services/api/**'
      - 'scripts/performance/**'
      - 'scripts/recovery/**'
      - 'migrations/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/api-ci.yml'
  push:
    branches: [main, dev, rakibul-hasan]
    paths:
      - 'services/api/**'
      - 'scripts/performance/**'
      - 'scripts/recovery/**'
      - 'migrations/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/api-ci.yml'

permissions:
  contents: read

concurrency:
  group: api-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: factoryos
          POSTGRES_PASSWORD: factoryos
          POSTGRES_DB: factoryos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U factoryos -d factoryos_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Prepare AI Tool Registry RLS integration database
        env:
          PGPASSWORD: factoryos
        run: |
          psql "postgresql://factoryos:factoryos@127.0.0.1:5432/factoryos_test" \
            -v ON_ERROR_STOP=1 \
            -f services/api/test/fixtures/ai-tool-registry-rls-bootstrap.sql
          psql "postgresql://factoryos:factoryos@127.0.0.1:5432/factoryos_test" \
            -v ON_ERROR_STOP=1 \
            -f migrations/026_ai_tool_registry_global_write_hardening.sql
      - name: Verify AI Tool Registry migration is rerunnable
        env:
          PGPASSWORD: factoryos
        run: |
          psql "postgresql://factoryos:factoryos@127.0.0.1:5432/factoryos_test" \
            -v ON_ERROR_STOP=1 \
            -f migrations/026_ai_tool_registry_global_write_hardening.sql
      - name: Prepare isolated API test environment
        shell: bash
        run: |
          cat > services/api/.env <<'EOF'
          NODE_ENV=test
          PORT=3001
          DATABASE_URL=postgresql://factoryos:factoryos@127.0.0.1:5432/factoryos_test
          JWT_SECRET=ci-only-not-a-production-secret
          AUTH_MODE=dev
          DEV_AUTH_ENABLED=false
          EOF
      - name: Validate bounded load and recovery harnesses
        run: |
          node --check scripts/performance/api-load-smoke.mjs
          node --check scripts/performance/api-load-smoke.test.mjs
          bash -n scripts/recovery/postgres-backup-restore-rehearsal.sh
      - name: Test bounded load-smoke safety and acceptance contract
        working-directory: services/api
        run: npm run test:load-smoke:contract
      - name: Lint API
        working-directory: services/api
        run: npm run lint
      - name: Build API
        working-directory: services/api
        run: npm run build
      - name: Run API unit tests
        working-directory: services/api
        run: node --experimental-vm-modules ../../node_modules/jest/bin/jest.js --config ./jest.config.cjs --runInBand --testPathIgnorePatterns='\.integration\.spec\.ts$|\.postgres\.integration\.spec\.ts$'
      - name: Run AI Tool Registry PostgreSQL RLS integration tests
        working-directory: services/api
        env:
          TEST_APP_DATABASE_URL: postgresql://factoryos_test_app:factoryos_test_app@127.0.0.1:5432/factoryos_test
        run: node --experimental-vm-modules ../../node_modules/jest/bin/jest.js --config ./jest.config.cjs --runInBand src/ai/tools/ai.tool.registry.rls.postgres.integration.spec.ts

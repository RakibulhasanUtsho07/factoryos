name: External Erasure Copy Retention Contract

on:
  pull_request:
    paths:
      - 'docs/external-erasure-backup-copy-retention-runbook.md'
      - 'docs/external-erasure-resource-ledger.md'
      - 'docs/tenant-cache-erasure-adapter.md'
      - 'scripts/audit/external-erasure-copy-retention-contract.test.mjs'
      - '.github/workflows/external-erasure-copy-retention-contract.yml'
  push:
    branches: [main, dev, rakibul-hasan]
    paths:
      - 'docs/external-erasure-backup-copy-retention-runbook.md'
      - 'docs/external-erasure-resource-ledger.md'
      - 'docs/tenant-cache-erasure-adapter.md'
      - 'scripts/audit/external-erasure-copy-retention-contract.test.mjs'
      - '.github/workflows/external-erasure-copy-retention-contract.yml'

permissions:
  contents: read

concurrency:
  group: external-erasure-copy-retention-\${{ github.workflow }}-\${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Verify backup-copy retention runbook contract
        run: node --test scripts/audit/external-erasure-copy-retention-contract.test.mjs

permissions:
  contents: read

concurrency:
  group: external-erasure-copy-retention-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Parse Kubernetes admission manifests
        run: |
          ruby -ryaml -e 'ARGV.each { |path| YAML.load_file(path) }' \
            deploy/security/backup-copy-evidence-readonly-policy.yaml \
            deploy/security/backup-copy-evidence-readonly-binding.yaml \
            deploy/security/backup-copy-evidence-api-service-account.yaml \
            deploy/security/backup-copy-evidence-api-service-account-policy.yaml \
            deploy/security/backup-copy-evidence-api-service-account-binding.yaml \
            deploy/security/backup-copy-evidence-api-token-secret-policy.yaml \
            deploy/security/backup-copy-evidence-api-token-secret-binding.yaml \
            deploy/security/backup-copy-evidence-namespace-lock-policy.yaml \
            deploy/security/backup-copy-evidence-namespace-lock-binding.yaml

      - name: Validate provisioning script syntax
        run: |
          bash -n deploy/security/provision-backup-copy-evidence-enforcement.sh
          bash -n scripts/security/backup-copy-evidence-kubernetes-admission-ci.sh

      - name: Verify backup-copy retention and signed evidence contracts
        run: |
          node --check scripts/security/require-supported-kubernetes-version.mjs
          node --check scripts/security/require-supported-kubernetes-version.test.mjs
          node --test scripts/audit/external-erasure-copy-retention-contract.test.mjs scripts/audit/backup-copy-class-evidence-attestation-contract.test.mjs scripts/security/sign-backup-copy-class-evidence.test.mjs scripts/security/backup-copy-evidence-readonly-admission.test.mjs scripts/security/backup-copy-evidence-deployment.test.mjs scripts/security/require-supported-kubernetes-version.test.mjs

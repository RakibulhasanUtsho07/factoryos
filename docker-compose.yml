services:
  postgres:
    image: postgres:17
    container_name: factoryos-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: factoryos
      POSTGRES_USER: factoryos
      POSTGRES_PASSWORD: factoryos_dev_password

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - factoryos_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U factoryos -d factoryos"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    container_name: factoryos-redis-cache
    restart: unless-stopped
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "yes"
      - --appendfsync
      - always
      - --maxmemory
      - 128mb
      - --maxmemory-policy
      - noeviction
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - factoryos_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  factoryos_postgres_data:
  factoryos_redis_data:
# Custom-query file for prometheus-community/postgres_exporter.
# Scrape using a dedicated read-only monitoring role with only the statistics
# visibility required by pg_stat_activity/pg_blocking_pids and SELECT on outbox_events.
# Never attach tenant IDs, event IDs, SQL, or payload values as metric labels.
factoryos_outbox_events:
  query: |
    SELECT status, COUNT(*)::double precision AS events
    FROM outbox_events
    WHERE status IN ('PENDING', 'FAILED', 'PROCESSING', 'QUARANTINED')
    GROUP BY status
  metrics:
    - status:
        usage: "LABEL"
        description: "Bounded outbox dispatch state"
    - events:
        usage: "GAUGE"
        description: "Number of outbox events in the bounded dispatch state"

factoryos_outbox_oldest:
  query: |
    SELECT
      status,
      GREATEST(EXTRACT(EPOCH FROM clock_timestamp() - MIN(created_at)), 0)::double precision AS age_seconds
    FROM outbox_events
    WHERE status IN ('PENDING', 'FAILED', 'PROCESSING', 'QUARANTINED')
    GROUP BY status
  metrics:
    - status:
        usage: "LABEL"
        description: "Bounded outbox dispatch state"
    - age_seconds:
        usage: "GAUGE"
        description: "Age in seconds of the oldest event in the dispatch state"

factoryos_outbox_freshness:
  query: |
    SELECT COALESCE(
      EXTRACT(EPOCH FROM clock_timestamp() - MAX(published_at)),
      -1
    )::double precision AS seconds_since_last_publish
    FROM outbox_events
  metrics:
    - seconds_since_last_publish:
        usage: "GAUGE"
        description: "Seconds since the most recent successful outbox publication; -1 means none has ever published"

factoryos_pg_blocking_sessions:
  query: |
    SELECT COUNT(*)::double precision AS count
    FROM pg_stat_activity AS activity
    WHERE activity.datname = current_database()
      AND activity.pid <> pg_backend_pid()
      AND cardinality(pg_blocking_pids(activity.pid)) > 0
  metrics:
    - count:
        usage: "GAUGE"
        description: "Active sessions blocked by another PostgreSQL session in this database"

factoryos_pg_lock_wait:
  query: |
    SELECT COALESCE(
      MAX(EXTRACT(EPOCH FROM clock_timestamp() - activity.query_start)),
      0
    )::double precision AS max_wait_seconds
    FROM pg_stat_activity AS activity
    WHERE activity.datname = current_database()
      AND activity.wait_event_type = 'Lock'
      AND activity.query_start IS NOT NULL
  metrics:
    - max_wait_seconds:
        usage: "GAUGE"
        description: "Maximum current lock-wait duration in seconds"

factoryos_pg_long_transactions:
  query: |
    SELECT COUNT(*)::double precision AS count
    FROM pg_stat_activity AS activity
    WHERE activity.datname = current_database()
      AND activity.pid <> pg_backend_pid()
      AND activity.state <> 'idle'
      AND activity.xact_start IS NOT NULL
      AND clock_timestamp() - activity.xact_start > INTERVAL '30 seconds'
  metrics:
    - count:
        usage: "GAUGE"
        description: "Active non-idle transactions older than 30 seconds"

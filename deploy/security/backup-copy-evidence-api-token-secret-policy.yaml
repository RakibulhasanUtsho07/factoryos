apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: factoryos-backup-evidence-api-token-secret
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["secrets"]
        scope: Namespaced
  validations:
    - expression: >-
        request.operation == 'DELETE' ||
        !has(object.type) || object.type != 'kubernetes.io/service-account-token'
      message: ServiceAccount token Secrets are forbidden in the enrolled backup-evidence API namespace; use the tokenless workload identity design.
      reason: Forbidden

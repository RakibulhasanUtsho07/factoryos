apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: factoryos-backup-evidence-api-service-account
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["serviceaccounts"]
        scope: Namespaced
  validations:
    - expression: >-
        request.operation == 'DELETE'
          ? oldObject.metadata.name != 'factoryos-backup-evidence-api'
          : (
              object.metadata.name != 'factoryos-backup-evidence-api' ||
              (
                has(object.automountServiceAccountToken) &&
                object.automountServiceAccountToken == false
              )
            )
      message: The factoryos-backup-evidence-api ServiceAccount must keep automountServiceAccountToken=false and cannot be deleted while backup-evidence enforcement is enrolled.
      reason: Forbidden

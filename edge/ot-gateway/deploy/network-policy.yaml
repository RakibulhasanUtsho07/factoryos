apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: factoryos-ot-edge-gateway
  namespace: factoryos-edge
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: factoryos-ot-edge-gateway
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: factoryos-api
          podSelector:
            matchLabels:
              app.kubernetes.io/name: factoryos-api
      ports:
        - protocol: TCP
          port: 8443
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: factoryos-monitoring
      ports:
        - protocol: TCP
          port: 8443
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: factoryos-api
          podSelector:
            matchLabels:
              app.kubernetes.io/name: factoryos-api
      ports:
        - protocol: TCP
          port: 443
    - to:
        - ipBlock:
            cidr: 10.42.2.10/32
      ports:
        - protocol: TCP
          port: 8883
    - to:
        - ipBlock:
            cidr: 10.42.1.10/32
      ports:
        - protocol: TCP
          port: 4840
    - to:
        - ipBlock:
            cidr: 10.42.1.20/32
      ports:
        - protocol: TCP
          port: 502
